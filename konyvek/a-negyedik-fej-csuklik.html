<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A negyedik fej csuklik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --papir:#F2F4EC; --tinta:#23271F; --zold:#1F6B4A; --narancs:#E4571B; --halk:#7d8177; --lap:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papir:#181B17; --tinta:#EDEFE7; --zold:#6FBF92; --narancs:#FF8D4F; --halk:#8f948a; --lap:#20241F; } }
:root[data-theme="dark"]{ --papir:#181B17; --tinta:#EDEFE7; --zold:#6FBF92; --narancs:#FF8D4F; --halk:#8f948a; --lap:#20241F; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--papir);color:var(--tinta);
 font-family:'Atkinson Hyperlegible',Verdana,Tahoma,sans-serif}
#lap{max-width:640px;margin:0 auto;padding:24px 20px 56px;min-height:100vh;display:flex;flex-direction:column}
.szam{font-size:15px;font-weight:700;color:var(--narancs);letter-spacing:.08em}
.kep{display:block;width:100%;height:auto;border-radius:8px;margin:14px 0 20px}
.vers{font-size:clamp(20px,5.2vw,26px);line-height:1.5;margin:0 0 20px}
.valasztek{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:12px}
.gomb{font:inherit;font-size:clamp(17px,4.2vw,20px);font-weight:700;text-align:left;
 background:var(--lap);color:var(--zold);border:2px solid var(--zold);border-radius:10px;
 padding:14px 16px;cursor:pointer;line-height:1.35}
.gomb:hover{background:var(--zold);color:var(--papir)}
.gomb:focus-visible{outline:3px solid var(--narancs);outline-offset:2px}
.gomb.fo{color:var(--narancs);border-color:var(--narancs)}
.gomb.fo:hover{background:var(--narancs);color:var(--papir)}
.cim{font-size:clamp(34px,9vw,52px);line-height:1.05;color:var(--zold);margin:8vh 0 0}
.sorozat{font-size:13px;letter-spacing:.2em;color:var(--narancs);margin-bottom:10px}
.alcim{font-size:17px;margin:14px 0 0;color:var(--halk)}
.befejezes{font-size:19px;font-weight:700;color:var(--narancs);margin:6px 0 0}
.lista{list-style:none;padding:0;margin:18px 0 0;font-size:17px;line-height:2}
.lista li{color:var(--halk)}
.lista li.meg{color:var(--tinta);font-weight:700}
.jel{color:var(--narancs);margin-right:10px}
.nyomjel{font-size:16px;font-weight:700;color:var(--narancs);border-top:2px solid var(--narancs);
 padding-top:10px;margin:4px 0 0;letter-spacing:.02em}
</style></head><body><div id="lap"></div>
<script>
const OLDAL = {"1": {"v": [[2, "Megvárod, hogy megismétlődjön"], [3, "Lemész a pincelejáróhoz"]], "s": [["Tavaly megtaláltad a hetedik fejet, tavasszal felvitted Müzlit egy egész napra, ősszel Margó nevet kapott, télen pedig a harmadik fej először kapott enni négyszáz év óta."], ["Ma reggel megrezzen az ablak a padban ülve."], ["Nem szél. Nem villamos.", "Alulról jön."]], "k": 2, "a": "Osztályterem, az ablaküveg rezeg, a gyerekek fel se néznek."}, "2": {"v": [[3, "Lapozz tovább"]], "s": [["Vársz, és közben számolsz magadban."], ["Huszonkettőnél jön a következő. Az ablak megint megrezzen, a tolltartód elmozdul egy centit a padon."], ["Senki más nem veszi észre. Az iskolában mindenki megszokta, hogy ez a ház néha megmozdul."]], "ny": "n01"}, "3": {"v": [[4, "Lapozz tovább"]], "s": [["A pincelejáró ajtaja mögül meleg jön, és a meleggel együtt egy hang, amit eddig csak mondókában hallottál."], ["HUKK."], ["A lépcsőkorlát beleremeg, és a mennyezetről lepereg egy kis mész."]], "k": 1, "a": "Pincelépcső alulról felfelé, a tetején világos ajtó, a falon narancssárga fény."}, "4": {"v": [[5, "Lapozz tovább"]], "s": [["A kazánház sarkában fekszik a negyedik fej, és most nem alszik."], ["Ő az, aki csuklik. Mindig csuklott, amióta ismered, de eddig csak álmában, és eddig csak halkan."], ["— Jó reggelt — mondja neked.", "HUKK."], ["A csuklástól egy pillanatra narancssárga lesz a sötét, mintha valaki gyufát gyújtana egy zsákban."]], "k": 3, "a": "Pinceszint sarka, nagy sárkányfej fekszik, a sötét narancssárgán felvillan."}, "5": {"v": [[7, "Megkérdezed a hatodik fejet"], [6, "Megkérdezed, milyen dolgot"]], "s": [["Müzli feje bukkan fel mögötte, és látszik rajta, hogy egész éjjel nem aludt."], ["— TEGNAP ÓTA NEM ÁLL EL — mondja. — ÉS EGYRE SŰRŰBB."], ["— Mióta ilyen rossz?", "— NYÁR ÓTA — mondja Müzli. — AMIÓTA MEGCSINÁLTÁK ODAFENT AZT A DOLGOT."]]}, "6": {"v": [[7, "Lapozz tovább"]], "s": [["— Milyen dolgot csináltak odafent? — kérdezed."], ["Müzli nem tudja megmondani, mert Müzli soha nem járt a kazánházban odafent."], ["De a negyedik fej tudja."], ["— Kicserélték — mondja. — A régit elvitték, és hoztak helyette egy újat, aminek nincs szája."]], "ny": "n02"}, "7": {"v": [[8, "Lapozz tovább"]], "s": [["A hatodik fej kinyitja a fél szemét."], ["Nála a szabályok találós kérdésben vannak, négyszáz éve, és most először nem kérdez semmit."], ["— A csuklás nem betegség — mondja egyszerűen. — A csuklás az, ami nem jött ki."], ["Müzli oldalra billenti a fejét.", "— EZT MOST NEM TALÁLÓS KÉRDÉSBEN MONDTAD — mondja."], ["— Nem — feleli a hatodik fej. — Mára elfogytak."]], "ny": "n03"}, "8": {"v": [[9, "Lapozz tovább"]], "s": [["A fal mellett egy befalazott boltív van, akkora, hogy beleférnél. A téglák újabbak, mint a többi."], ["— Ott volt a régi kazán — mondja a negyedik fej. — Szén ment bele, és én belefújtam. Minden télen. Százhúsz éven át."], ["HUKK."], ["— És fent meleg volt — teszi hozzá. — Erről sem tudtak semmit."]], "k": 4, "a": "Befalazott boltív a pincefalban, a téglák újabbak a többinél.", "ny": "n04"}, "9": {"v": [[10, "Megkérdezed, milyen érzés"], [12, "Megnézed a téglákat közelebbről"], [14, "Szólsz Margónak"], [16, "Megnézed az ötödik fejet"], [11, "Megkérdezed Tesséket"], [13, "Közelebb mész hozzá"], [15, "Hagyod, hogy Müzli megpróbálja"], [18, "Felmész"]], "s": [["Becsengetésig van még néhány perced, és idelent több minden van, mint amennyit eddig megnéztél."]]}, "10": {"v": [[17, "Lapozz tovább"]], "s": [["— Milyen érzés? — kérdezed, mert ezt még soha senki nem kérdezte meg tőle."], ["A negyedik fej sokáig gondolkodik."], ["— Mint amikor tüsszenteni kell — mondja —, és valaki azt mondja, hogy most ne."], ["HUKK."], ["— Csak nálam ez nyár óta tart."]], "ny": "n05"}, "11": {"v": [[17, "Lapozz tovább"]], "s": [["A harmadik fej — akit tavaly óta Tesséknek hívnak — letol a saját kövéről egy fél almát a negyedik elé."], ["— Ha eszel, elmúlik — mondja. — Nálam mindig elmúlik tőle."], ["A negyedik fej megeszi, és hálásan bólint."], ["HUKK."], ["— Nálam minden ettől múlik el — teszi hozzá Tessék. — De lehet, hogy ez csak nálam van így."]], "ny": "n06"}, "12": {"v": [[17, "Lapozz tovább"]], "s": [["A boltív téglái közül az egyik meglazult, és mögötte fekete a habarcs."], ["Korom. Régi, kemény, vastag korom."], ["Ez az egyetlen hely az iskolában, ahol valaha tűz volt, és ez az egyetlen hely, amit befalaztak."]], "ny": "n07"}, "13": {"v": [[17, "Lapozz tovább"]], "s": [["A negyedik fej elfordítja a fejét, amikor közelebb mész."], ["— Ne nézz — mondja."], ["— Miért ne? — kérdezed."], ["— Mert négyszáz évig senki nem vette észre, hogy vagyok — mondja —, és most mindenki engem hall."], ["Ez az első mondat ma, amitől nem nevetni van kedved."]], "ny": "n08"}, "14": {"v": [[17, "Lapozz tovább"]], "s": [["Margó kinyitja a szemét, és rögtön papírt keres, mert Margó azóta mindent leírat."], ["— Mikor kezdődött? — kérdezi. — Milyen sűrűn? Mekkora?"], ["— Nem tudom pontosan — mondod."], ["— Akkor derítsd ki — mondja Margó. — Amit nem mérünk meg, azt csak találgatjuk."]], "ny": "n09"}, "15": {"v": [[17, "Lapozz tovább"]], "s": [["— ÉN TUDOM A MEGOLDÁST — mondja Müzli, ahogy csak ő tudja mondani."], ["— Mi az? — kérdezed."], ["— MEGIJESZTEM — feleli."], ["Aztán odamegy a testvéréhez, és a fülébe ordít akkorát, hogy a mennyezetről lejön a mész."], ["A negyedik fej meg se rezzen.", "— Hallottalak jönni — mondja."]], "ny": "n10"}, "16": {"v": [[17, "Lapozz tovább"]], "s": [["Az ötödik fej a fal mellett ül, és kopog, ahogy mindig."], ["Kop. Kop-kop. Kop."], ["Csakhogy ma nem így kopog. Ma gyorsabban, és pontosan akkor hagyja abba, amikor jön a csuklás."], ["Mintha ő is számolná."]], "ny": "n11"}, "17": {"v": [[10, "Megkérdezed, milyen érzés"], [12, "Megnézed a téglákat közelebbről"], [14, "Szólsz Margónak"], [16, "Megnézed az ötödik fejet"], [11, "Megkérdezed Tesséket"], [13, "Közelebb mész hozzá"], [15, "Hagyod, hogy Müzli megpróbálja"], [18, "Felmész"]], "s": [["Odafentről már hallatszanak a lépések, ahogy megtelik a folyosó."], ["Még egy dolgot megnézhetsz, aztán indulni kell."]]}, "18": {"v": [[19, "Lapozz tovább"]], "s": [["Felmész a lépcsőn, és a folyosón minden a szokásos: kabátok, cipőszag, kiabálás."], ["Aztán HUKK, és a folyosó végén megzörren egy ablak."], ["Senki nem néz oda. Mindenki azt hiszi, hogy a fűtés."]]}, "19": {"v": [[20, "Megkérdezed, hova ment a régi kémény"], [21, "Bemész az osztályba"]], "s": [["Lajos bácsi a radiátor mellett térdel, és egy nagy csavarkulccsal babrál valamit."], ["— Megint ez — mondja. — Nyár óta minden nap. Pedig új a kazán."], ["— Mi lett a régivel? — kérdezed."], ["— Kidobták — mondja Lajos bácsi. — Pedig az soha nem csinált ilyet."]], "k": 5, "a": "A gondnok a folyosón egy radiátor mellett térdel szerszámmal."}, "20": {"v": [[21, "Lapozz tovább"]], "s": [["— És a kémény? — kérdezed. — Az is elment?"], ["Lajos bácsi felnéz, és most először néz rád úgy, mint egy felnőttre."], ["— A kémény megvan — mondja. — Kéményt nem lehet kidobni. Csak befalazták alul meg felül."], ["— És középen? — kérdezed.", "— Középen ott van, ahol mindig — mondja Lajos bácsi."]], "ny": "n12"}, "21": {"v": [[22, "Lapozz tovább"]], "s": [["Becsengetnek, és belép Márti néni."], ["Olvasásóra. A táblára ír, és a kréta megcsúszik a kezében, amikor HUKK."], ["— Ez a ház — mondja Márti néni, és tovább ír."]]}, "22": {"v": [[23, "Lapozz tovább"]], "s": [["Matekóra. Ez a kedvenced, mert matekon mindig kiderül, hogy igazad van-e."], ["Márti néni kivonást ír a táblára, te pedig a füzeted szélén mást számolsz."], ["Reggel huszonkét másodperc telt el két HUKK között. Most tizennégy."], ["Az nem kevesebb eggyel. Az majdnem a fele."], ["Ha mindig feleződik, akkor délutánra nem marad közöttük semmi."], ["— Vili, te most min gondolkodsz? — kérdezi Márti néni."], ["— Azon, hogy mikor lesz nulla — mondod, és ez tökéletesen igaz."]], "k": 6, "a": "Füzetlap széle, a margón számok egymás alatt, mellette kivonás a táblán.", "ny": "n13"}, "23": {"v": [[24, "Visszatartatod vele a levegőt"], [26, "Hét korty vizet itatsz vele"], [29, "Mézet adsz neki"], [35, "Citromot vagy ecetet adsz neki"], [37, "Papírzacskóba lélegeztetnéd"], [25, "Megnézed az új kazánt"], [27, "Bemész a tornaterembe"], [30, "Megállsz a lépcsőnél"], [36, "Megkérdezed Márti nénit"], [38, "Benézel a konyhába"], [28, "Kimész az udvarra a mogyorógyárhoz"], [31, "Elmész a nagyok folyosója felé"], [32, "Bemész az énekórára"], [33, "Megkérdezed Áront"], [34, "Kivonultok tűzriadó-gyakorlatra"]], "s": [["Szünet. A folyosón mindenki arról beszél, hogy remeg az ablak, és mindenki tud rá valami biztos módszert."], ["Otthon is mindig van valaki, aki tudja, mitől múlik el a csuklás."]]}, "24": {"v": [[39, "Lapozz tovább"]], "s": [["Lerohansz, és megkéred, hogy tartsa vissza a levegőt tizenöt másodpercig."], ["A negyedik fej visszatartja. Te számolsz. A pince elcsendesedik."], ["Tizennégynél HUKK, és a szám végét már nem hallod."], ["— Akkor húsz — mondod.", "Húsznál nagyobbat hukkan, mint eddig bármikor."], ["Megtanulsz valamit: aki hónapok óta tart vissza valamit, annak nem attól lesz jobb, ha még tovább tartja."]], "ny": "n14"}, "25": {"v": [[39, "Lapozz tovább"]], "s": [["A lépcső alatt van egy ajtó, amin tavaly még nem volt lakat. Most van."], ["Mögötte zúg az új kazán, és a zúgás nem áll le soha."], ["Egy fehér doboz, tele csövekkel, és sehol rajta egy nyílás, amin be lehetne fújni valamit."], ["Aminek nincs szája. Most már érted, mit jelent."]], "k": 8, "a": "Lakatos ajtó mögött fehér kazándoboz csövekkel, sehol egy nyílás.", "ny": "n15"}, "26": {"v": [[39, "Lapozz tovább"]], "s": [["Hozol egy pohár vizet, és megkéred, hogy igyon hét kortyot lassan, egymás után, megállás nélkül."], ["Hét korty neki annyi, mint neked hét csepp. Meg is issza az egészet, és a pohár is majdnem vele megy."], ["HUKK."], ["— És ha szívószállal iszod? — kérdezed."], ["A papírszívószál a második lélegzetnél lángra kap, és úgy ég el, mint egy gyufaszál."]], "ny": "n16"}, "27": {"v": [[39, "Lapozz tovább"]], "s": [["Testnevelés. Anita néni sípol, ti pedig kosárlabdáztok."], ["HUKK, és a bordásfal végigzörren a falon, mint egy hosszú xilofon."], ["— Ez a fűtés — mondja Anita néni, és tovább sípol."], ["Ma már a negyedik felnőtt mondja ezt a szót, és ma már neked is furcsa."]], "ny": "n17"}, "28": {"v": [[39, "Lapozz tovább"]], "s": [["Nagyszünet, udvar. A fák alatt lehullott mogyoróból nálatok egész üzem lett."], ["Ketten szedik, egy válogat, te pedig töröd, mert te találtad azt a lapos követ, ami pont jó rá."], ["A mogyorógyár akkor kezdődött, amikor megrándult a bokád, és nem tudtál a többiekkel szaladgálni. Azóta is így megy, pedig a bokád rég meggyógyult."], ["Ma viszont a kő minden hetedik ütés után magától megugrik a földön, és nem te ugrasztod meg."]], "k": 7, "a": "Iskolaudvar fák alatt, gyerekek mogyorót törnek egy lapos kövön.", "ny": "n18"}, "29": {"v": [[39, "Lapozz tovább"]], "s": [["A konyhából kérsz egy kanál mézet, és elmagyarázod, hogy a nyelve tövén kell tartani, és nem szabad lenyelni."], ["A negyedik fej nyelve akkora, mint egy szőnyeg. A kanál eltűnik rajta."], ["Öt másodpercig csend van, és öt másodpercig azt hiszed, hogy sikerült."], ["HUKK."], ["A kanál nem jön vissza."]], "ny": "n19"}, "30": {"v": [[39, "Lapozz tovább"]], "s": [["Emőke a lépcsőn ül, és most nem énekel."], ["— Megint az — mondja, amikor melléd ér a következő HUKK."], ["— A fűtés — mondod."], ["— Nem fűtés — mondja Emőke, ugyanúgy, mint télen. — De ha nem akarod elmondani, nem baj."], ["Nem kérdez tovább. Emőke soha nem kérdez tovább."]], "ny": "n20"}, "31": {"v": [[39, "Lapozz tovább"]], "s": [["A folyosón elmegy melletted egy ötödikes, akit szintén Vilinek hívnak."], ["Ő a legrosszabb gyerek a suliban, és most is olyan csúnyát mond, amit nem lenne szabad kimondani."], ["Mindig furcsa, hogy két embert ugyanúgy hívnak, és mégsem ugyanolyanok."], ["Ahogy elmegy melletted, HUKK, és a nagy Vili megtorpan."], ["— Mi van ezzel a házzal? — mondja, aztán gyorsabban megy tovább."]], "ny": "n21"}, "32": {"v": [[39, "Lapozz tovább"]], "s": [["Énekóra. Márti néni előénekli a hangot, az osztály pedig folytatja."], ["Emőke szépen énekel, ezért ő kezdi."], ["Amikor elhallgattok, a padló alól visszajön ugyanaz a hang. Nem HUKK, és nem is dörgés. Éneklés."], ["Halkan, de pontosan ugyanazon a hangon, amit az előbb énekeltetek."], ["Ez nem a csuklás. Ez valaki más, és ez a valaki figyel."], ["Emőke rád néz. Te Emőkére. Senki más nem hallotta meg."], ["— Csináljuk még egyszer — mondja halkan Emőke."]], "k": 9, "a": "Osztály énekel, egy gyerek a padlóra néz.", "ny": "n22"}, "33": {"v": [[39, "Lapozz tovább"]], "s": [["Áron a pad tetején ül, és Áron mindent tud, amit otthon hallott."], ["— A nagyapámnak három napig tartott a csuklása — mondja. — Kórházba is vitték."], ["— És mitől múlt el? — kérdezed."], ["Áron vállat von.", "— Magától. Vagy nem magától. Nekem senki nem mondta meg."]], "ny": "n23"}, "34": {"v": [[39, "Lapozz tovább"]], "s": [["Tűzriadó-gyakorlat. Az egész iskola kivonul az udvarra, és Lajos bácsi a lépcsőn állva számolja az osztályokat."], ["Odakint mindenki fázik, és senki nem figyel semmire."], ["Aztán HUKK, és a földön, a talpad alatt, végigfut egy rezdülés."], ["Most nincs se fűtés, se radiátor, se csövek az épületben, amire rá lehetne fogni."], ["Egy felnőtt sem néz oda. Neked viszont ez az első biztos bizonyítékod."]], "ny": "n24"}, "35": {"v": [[39, "Lapozz tovább"]], "s": [["Egy gerezd citrom, pár csepp ecet vagy egy korty citromlé. Ezt anya szokta mondani, és otthon néha be is válik."], ["A citromtól a negyedik fej egész arca összemegy, és olyan képet vág, amit soha nem felejtesz el."], ["Aztán HUKK."], ["— Savanyú — mondja. — De jó savanyú."]], "ny": "n25"}, "36": {"v": [[39, "Lapozz tovább"]], "s": [["— Márti néni, mitől múlik el a csuklás? — kérdezed óra után."], ["Márti néni leteszi a tollat, és ez azt jelenti, hogy a kérdés jó volt."], ["— Attól, hogy nem gondolsz rá — mondja. — Meg attól, hogy kiengeded, amit visszatartasz."], ["Aztán visszaveszi a tollat.", "— A kettő közül a második a nehezebb."]], "ny": "n26"}, "37": {"v": [[39, "Lapozz tovább"]], "s": [["Papírzacskóba kellene lélegeznie."], ["Papírzacskó csak egy van az egész iskolában: reggel valaki kakaóscsigát hozott a pékségből, és a zacskó ott maradt a padon."], ["Akkora, mint a negyedik fej fél orrlyuka. Két lélegzetnél tart, amikor eltűnik."], ["— Lenyelted? — kérdezed.", "— Nem — mondja a negyedik fej. — Elégett."]], "ny": "n27"}, "38": {"v": [[39, "Lapozz tovább"]], "s": [["A konyhaajtó nyitva, és a konyhás néni a nagy fazék fölött áll."], ["A leves felszíne minden hét másodpercben megrezzen, szabályos körökben."], ["— Mióta rezeg így a leves? — kérdezed."], ["— Nyár óta — mondja a konyhás néni. — De a leves nem lesz tőle rosszabb."]], "ny": "n28"}, "39": {"v": [[24, "Visszatartatod vele a levegőt"], [26, "Hét korty vizet itatsz vele"], [29, "Mézet adsz neki"], [35, "Citromot vagy ecetet adsz neki"], [37, "Papírzacskóba lélegeztetnéd"], [25, "Megnézed az új kazánt"], [27, "Bemész a tornaterembe"], [30, "Megállsz a lépcsőnél"], [36, "Megkérdezed Márti nénit"], [38, "Benézel a konyhába"], [28, "Kimész az udvarra a mogyorógyárhoz"], [31, "Elmész a nagyok folyosója felé"], [32, "Bemész az énekórára"], [33, "Megkérdezed Áront"], [34, "Kivonultok tűzriadó-gyakorlatra"], [40, "Becsengetnek az utolsó órára"]], "s": [["A szünetből még maradt pár perc, és a következő HUKK most hamarabb jött, mint az előző."], ["Ezt már te is hallod."]]}, "40": {"v": [[41, "Lapozz tovább"]], "s": [["Ebéd. Leves, utána rakott tészta, ami vagy nagyon jó, vagy nagyon nem. Ma nagyon jó."], ["A tálcák halkan zörögnek az asztalon, mindig ugyanannyi idő múlva."], ["Levi átnéz rád az asztal fölött.", "— Te tudsz valamit — mondja."], ["Nem kérdés volt, úgyhogy nem is válaszolsz rá."]]}, "41": {"v": [[42, "Megkéred Pannit, hogy mérje meg"], [43, "Megkéred Alvint, hogy keresse meg a kéményt"], [44, "Megkérdezed Danit, hogyan lehet valakit megijeszteni"], [45, "Elmondod Lajos bácsinak az igazat"], [46, "Bekopogsz az igazgatói irodába"]], "s": [["Utolsó óra után az iskola lelassul. A folyosók kiürülnek, és a csuklás egyre kevesebb időt hagy két HUKK között."], ["Négyig még van idő, és annyi emberhez mehetsz oda, ahányhoz akarsz."], ["Kihez mész először?"]], "k": 10, "a": "Üres iskolafolyosó délután, a padlón vékony porcsík rezeg."}, "42": {"v": [[47, "Lapozz tovább"]], "s": [["Panni a lépcsőn ül, és Panni mindent felír, amióta Szimat naplóját olvassa."], ["— Meg tudnád mérni, hány másodperc telik el két rezgés között? — kérdezed."], ["Panni bólint, és nem kérdezi meg, hogy minek."], ["Fél óráig ül ott egy órával a kezében, és a végén odaadja a papírt, szép egyenletes betűkkel."], ["Reggel huszonkét másodperc. Délben tizennégy. Most hét."], ["— Este nullára ér — mondja Panni, és ez a legrosszabb mondat, amit ma hallottál."]], "ny": "n29"}, "43": {"v": [[47, "Lapozz tovább"]], "s": [["Alvin a folyosói alaprajz előtt áll, mert Alvin mindig a térképek előtt áll."], ["Megkérdezed, hol van a régi kémény."], ["Alvin végigmegy az ujjával a falon, és megáll egy vonalnál, ami nincs is rajta a rajzon."], ["— Itt fel kell mennie valahol — mondja. — A kémény nem tud eltűnni. Csak nem rajzolták be."]], "ny": "n30"}, "44": {"v": [[47, "Lapozz tovább"]], "s": [["Dani bűvészkedni tanul, és Daninak mindig van türelme kivárni a megfelelő pillanatot."], ["Elmondod neki, hogy van valaki, akinek nem múlik el a csuklása."], ["— Próbáltátok már megijeszteni? — kérdezi Dani."], ["— Azt nem lehet megijeszteni, aki tudja, hogy meg akarod ijeszteni — mondod."], ["Dani elvigyorodik.", "— Akkor nekem kell lemennem — mondja. — És neki nem szabad tudnia, hogy ott vagyok."]], "ny": "n31"}, "45": {"v": [[47, "Lapozz tovább"]], "s": [["Lajos bácsi a szertárban ül, és végighallgat, amíg elmondod. Az egészet."], ["Nem nevet ki. Csak bólint, mint aki erre számított."], ["— A kéményajtó a kazánház mögött van — mondja. — Befalazták, de nem kívülről. Belülről csak be van tolva egy lemez."], ["Leakaszt egy kulcsot a karikáról, és a kezedbe adja.", "— Négyig itt vagyok."]], "ny": "n32"}, "46": {"v": [[47, "Lapozz tovább"]], "s": [["Az igazgató néni az asztalánál ül, és fel sem néz, amikor megszólalsz."], ["— Tudom — mondja."], ["Aztán mégis felnéz."], ["— Én is ott voltam nyáron, amikor befalazták — mondja. — És nem szóltam. Azt hittem, úgy lesz a legjobb neki, ha nyugton marad."], ["Ez az első alkalom, hogy az igazgató néni azt mondja neked, hogy tévedett."]], "ny": "n33"}, "47": {"v": [[42, "Megkéred Pannit, hogy mérje meg"], [43, "Megkéred Alvint, hogy keresse meg a kéményt"], [44, "Megkérdezed Danit, hogyan lehet valakit megijeszteni"], [45, "Elmondod Lajos bácsinak az igazat"], [46, "Bekopogsz az igazgatói irodába"], [48, "Lemész hozzá"]], "s": [["Odakint sötétedik, és a folyosó végén megzörren az összes ablak egyszerre."], ["Két HUKK között most hét másodperc telik el. A következőig már csak hat."]]}, "48": {"v": [[49, "Lapozz tovább"]], "s": [["Lemész, és a lépcsőn már nem kell számolnod, mert a HUKK olyan sűrű, hogy egyetlen hosszú dobogásnak hallatszik."], ["A negyedik fej nem néz rád. Szégyelli."], ["— Menj fel — mondja. — Mindjárt vége lesz valaminek, és nem akarom, hogy itt legyél."]], "k": 11, "a": "Pincelépcső alja, nagy sárkányfej elfordítva, szálló por."}, "49": {"v": [[50, "Nálad van a kulcs, és Alvin megmutatta, merre megy a kémény"], [51, "Nálad van a kulcs, de nem tudod, merre megy a kémény"], [52, "Nincs kulcsod, de az igazgató néni lejött veled"], [53, "Nincs kulcsod, de Dani lent ül a sötétben"], [54, "Semmi ilyen nincs, és mégis azt mondod, hogy engedje ki"], [55, "Azt mondod, hogy tartsa vissza"]], "s": [["Négy óra. Odafent Lajos bácsi mindjárt hazamegy, és az új kazán egész nap úgy zúg, mint aki fél."], ["Nézd végig a listát felülről lefelé, és állj meg az első olyan sornál, ami igaz rád."]]}, "50": {"v": [], "s": [["A kazánház mögött megtalálod a lemezt, és a kulcs pont abba a zárba jó, amit nyáron toltak be utoljára."], ["Mögötte hideg huzat, és fölötte egy fekete cső, ami egyenesen felmegy a tetőig."], ["— Most — mondod."], ["A negyedik fej odafordítja a fejét, és nyár óta először kiengedi."], ["A láng felmegy a kéményen, a tetőn kijön a füst, és a fél utca látja. Senki nem hívja a tűzoltókat, mert egy iskolakémény füstöl, és egy iskolakémény füstölhet."], ["Odafent langyos lesz a radiátor. Aztán meleg."], ["Másnap reggel Márti néni megáll a folyosón, és megkérdezi, mitől ilyen jó meleg."], ["— A fűtés — mondod."], ["Délután lemész, és elmeséled neki, mit kérdezett Márti néni, meg hogy mit feleltél."], ["— Így hívnak? Fűtés? — kérdezi."], ["— Az egész iskola így hívott téged egész évben — mondod. — Csak eddig senki nem tudta, hogy ez a neved."]], "b": [1, "Fűtés"], "k": 12, "a": "Fekete kéménycső belülről felfelé, a mélyén narancssárga fény."}, "51": {"v": [], "s": [["A kulcs jó, a lemez enged, és mögötte tényleg ott a kémény."], ["Csak azt nem tudod, hova megy fel. Lajos bácsi már hazament, és nincs, aki megmondja."], ["Így hát kinyitjátok az ajtót, és csak annyit engedtek ki, amennyi biztosan elfér: egy lélegzetnyit."], ["A csuklás megritkul. Nem áll el, de a hét másodpercből megint húsz lesz."], ["Másnap Lajos bácsi megtalálja a nyitott lemezt, és nem kérdez semmit. Csak kitámasztja egy téglával, hogy ne csukódjon vissza."], ["Azóta a folyosónak az a vége, ahol a pincelejáró van, melegebb, mint a másik. Senki nem tudja, miért."]], "b": [2, "A kitámasztott ajtó"]}, "52": {"v": [], "s": [["Az igazgató néni jön le veled, és ő megy elöl."], ["Nem kulcsot hoz, hanem egy kalapácsot, és azzal üti ki a boltívből azt a hat téglát, amit nyáron ő engedett berakni."], ["— Én mondtam, hogy falazzák be — mondja. — Akkor is hallottam, hogy csuklik. Azt hittem, majd elmúlik."], ["A negyedik fej kifújja a levegőt a nyíláson, és a korom felszáll a régi kürtőn."], ["Aztán az igazgató néni leül a törmelékre a jó kabátjában, és sokáig nem szól semmit."], ["— Fél évig bírta — mondja végül. — Én egy hétig sem bírtam volna."]], "b": [3, "A hat tégla"]}, "53": {"v": [], "s": [["Dani már két órája ül a sötétben a lépcső alatt, és meg sem mozdul, mert Daninak van türelme."], ["Amikor a negyedik fej legkevésbé számít rá, Dani kilép, és csinál valamit a kezével, amit utána sem tudsz megmagyarázni."], ["A negyedik fej akkorát ijed, hogy a pince fele megvilágosodik."], ["És elmúlik. Tényleg elmúlik."], ["Fent az ablakok elhallgatnak, és este mindenki azt hiszi, megjavult a fűtés."], ["Másnap reggel, olvasásóra közben, megrezzen az ablak.", "HUKK."], ["Az ijedség egy napra elég volt. A kéményből viszont minden télen lehetne."]], "b": [4, "Holnap újra"]}, "54": {"v": [], "s": [["— Engedd ki — mondod. — Itt. Most."], ["A negyedik fej rád néz, és mert eddig még soha senki nem mondta neki, hogy bármit is kiengedhet, megteszi."], ["A láng nem talál kéményt. A pinceajtó kifordul, a füst felmegy a lépcsőn, és a folyosón megszólal a tűzjelző."], ["Tűzoltók. Szirénák. Az egész iskola az udvaron áll pulóverben."], ["Senkinek nem lesz baja. A kazánházról azt írják a jegyzőkönyvbe, hogy az új berendezés hibás."], ["Kiszerelik, és két hétig megint hideg van."], ["Odalent viszont csend van, és a negyedik fej alszik, először nyár óta."]], "b": [5, "A tűzriadó"]}, "55": {"v": [], "s": [["— Tartsd vissza — mondod. — Még egy kicsit. Amíg kitalálunk valamit."], ["A negyedik fej bólint, mert ő mindig bólint, ha kérnek tőle valamit."], ["Csakhogy a tűznek mennie kell valahova. Ha nincs kémény, akkor arra megy, amerre tud."], ["Éjszaka akkorát reccsen valami az iskola alatt, hogy a szomszéd házban is felébrednek."], ["Reggel az új kazánban megrepedt egy cső, és a szerelő azt mondja, hogy ilyet még nem látott."], ["Két hónapig megint két pulóverben ültök az órákon, pont, mint tavaly."], ["És odalent valaki még mindig visszatartja, mert te kérted."]], "b": [6, "A hideg tél"]}};

const NYOMOK = [["n01", "Huszonkét másodperc"], ["n02", "Aminek nincs szája"], ["n03", "Ami nem jött ki"], ["n04", "A befalazott boltív"], ["n05", "Mint a tüsszentés"], ["n06", "Tessék fél almája"], ["n07", "A korom a téglák mögött"], ["n08", "Ne nézz"], ["n09", "Meg kell mérni"], ["n10", "Müzli megpróbálja"], ["n11", "Az ötödik fej is számol"], ["n12", "A kémény megvan"], ["n13", "Mikor lesz nulla"], ["n14", "Tizenöt, aztán húsz"], ["n15", "A fehér doboz"], ["n16", "Hét korty víz"], ["n17", "A negyedik felnőtt"], ["n18", "A mogyorógyár"], ["n19", "Egy kanál méz"], ["n20", "Emőke megint tudja"], ["n21", "A másik Vili"], ["n22", "A padló visszaénekel"], ["n23", "Áron nagyapja"], ["n24", "A talpad alatt"], ["n25", "Egy gerezd citrom"], ["n26", "Amit visszatartasz"], ["n27", "A zacskó elégett"], ["n28", "A leves körei"], ["n29", "Panni mérése"], ["n30", "Alvin vonala"], ["n31", "Dani terve"], ["n32", "A kéményajtó kulcsa"], ["n33", "Az igazgató néni tévedése"]];
const KULCS = "mk:v1:csuklik:veg";
const KULCS_NY = "mk:v1:csuklik:nyom";
let talalt = new Set();
let nyomok = new Set();
try{ const m = localStorage.getItem(KULCS); if(m) talalt = new Set(JSON.parse(m)); }catch(e){}
try{ const m = localStorage.getItem(KULCS_NY); if(m) nyomok = new Set(JSON.parse(m)); }catch(e){}

/* --- nyom-azonosítók ----------------------------------------------------
   A nyomokat azonosító (n01, n02...) jelöli, nem a szövegük, ezért a
   szöveg bármikor átírható anélkül, hogy az olvasó elveszítené. A NYCIM
   a kiíráshoz kell, a két Set pedig megvédi a számlálót. ------------------ */
const NYID = new Set(NYOMOK.map(x=>x[0]));
const NYCIM = new Map(NYOMOK);
const VEGID = new Set(VEGEK.map(x=>x[0]));
(function(){
  try{
    const regi = localStorage.getItem("csuklik-nyomok");
    if(regi) JSON.parse(regi).forEach(x=>{
      if(NYID.has(x)) nyomok.add(x); else if(NYCIM.has(x)) nyomok.add(x);
    });
    const regiV = localStorage.getItem("csuklik-befejezesek");
    if(regiV) JSON.parse(regiV).forEach(x=>{ if(VEGID.has(x)) talalt.add(x); });
  }catch(e){}
  nyomok = new Set([...nyomok].filter(x=>NYID.has(x)));
  talalt = new Set([...talalt].filter(x=>VEGID.has(x)));
})();
function ment(){ try{ localStorage.setItem(KULCS, JSON.stringify([...talalt]));
  localStorage.setItem(KULCS_NY, JSON.stringify([...nyomok])); }catch(e){} }
const lap = document.getElementById("lap");
function el(t,c,sz){ const e=document.createElement(t); if(c) e.className=c; if(sz) e.textContent=sz; return e; }
function cimlap(){
  lap.innerHTML="";
  lap.appendChild(el("div","sorozat","ÖTÖDIK KÖNYV"));
  const h=el("h1","cim"); h.innerHTML="A negyedik fej<br>csuklik"; lap.appendChild(h);
  if(KEPEK[1]){ const im=document.createElement("img"); im.className="kep"; im.src=KEPEK[1]; im.alt=""; lap.appendChild(im); }
  const v=el("div","valasztek");
  const a=el("button","gomb fo","Kezdjük!"); a.onclick=()=>mutat(1); v.appendChild(a);
  const b=el("button","gomb","Befejezések ("+talalt.size+"/"+VEGEK.length+")"); b.onclick=gyujtemeny; v.appendChild(b);
  const c=el("button","gomb","Nyomok ("+nyomok.size+"/"+NYOMOK.length+")"); c.onclick=nyomlap; v.appendChild(c);
  lap.appendChild(v);
}
function gyujtemeny(){
  lap.innerHTML="";
  lap.appendChild(el("div","szam", talalt.size+" / "+VEGEK.length));
  lap.appendChild(el("h1","cim","Befejezések"));
  const ol=el("ul","lista");
  VEGEK.forEach(([n,cim])=>{
    const megvan=talalt.has(n);
    const li=el("li", megvan?"meg":"");
    const j=el("span","jel", megvan?"✓":"·"); li.appendChild(j);
    li.appendChild(document.createTextNode(megvan? n+". "+cim : n+". ?"));
    ol.appendChild(li);
  });
  lap.appendChild(ol);
  const v=el("div","valasztek");
  const a=el("button","gomb fo","Vissza a címlapra"); a.onclick=cimlap; v.appendChild(a);
  lap.appendChild(v);
}
function nyomlap(){
  lap.innerHTML="";
  lap.appendChild(el("div","szam", nyomok.size+" / "+NYOMOK.length));
  lap.appendChild(el("h1","cim","Nyomok"));
  lap.appendChild(el("p","alcim","Egy olvasással nem fér bele mind."));
  const ol=el("ul","lista");
  NYOMOK.forEach(([nyid,cim])=>{
    const megvan=nyomok.has(nyid);
    const li=el("li", megvan?"meg":"");
    const j=el("span","jel", megvan?"✓":"·"); li.appendChild(j);
    li.appendChild(document.createTextNode(megvan? cim : "?"));
    ol.appendChild(li);
  });
  lap.appendChild(ol);
  const v=el("div","valasztek");
  const a=el("button","gomb fo","Vissza a címlapra"); a.onclick=cimlap; v.appendChild(a);
  lap.appendChild(v);
}
function mutat(sz){
  const o=OLDAL[sz]; lap.innerHTML=""; window.scrollTo(0,0);
  lap.appendChild(el("div","szam",sz+". oldal"));
  if(o.k && KEPEK[o.k]){ const im=document.createElement("img"); im.className="kep";
    im.src=KEPEK[o.k]; im.alt=o.a||""; lap.appendChild(im); }
  o.s.forEach(sorok=>{ const p=el("p","vers"); p.innerHTML=sorok.join("<br>"); lap.appendChild(p); });
  if(o.ny){
    const ujE = !nyomok.has(o.ny);
    nyomok.add(o.ny); ment();
    lap.appendChild(el("p","nyomjel",(ujE?"ÚJ NYOM — ":"NYOM — ")+(NYCIM.get(o.ny)||o.ny)));
  }
  const v=el("div","valasztek");
  if(o.b){
    talalt.add(o.b[0]); ment();
    lap.appendChild(el("p","befejezes",o.b[0]+". befejezés: "+o.b[1]));
    const a=el("button","gomb fo","Újra az elejéről"); a.onclick=()=>mutat(1); v.appendChild(a);
    const b=el("button","gomb","Befejezések ("+talalt.size+"/"+VEGEK.length+")"); b.onclick=gyujtemeny; v.appendChild(b);
  const c=el("button","gomb","Nyomok ("+nyomok.size+"/"+NYOMOK.length+")"); c.onclick=nyomlap; v.appendChild(c);
  } else {
    o.v.forEach(([cel,szoveg])=>{
      const b=el("button","gomb"+(o.v.length===1?" fo":""),szoveg);
      b.onclick=()=>mutat(cel); v.appendChild(b);
    });
  }
  lap.appendChild(v);
}
cimlap();
