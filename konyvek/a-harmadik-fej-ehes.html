<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A harmadik fej éhes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{ --papir:#F2F4EC; --tinta:#23271F; --zold:#1F6B4A; --narancs:#E4571B; --halk:#7d8177; --lap:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papir:#181B17; --tinta:#EDEFE7; --zold:#6FBF92; --narancs:#FF8D4F; --halk:#8f948a; --lap:#20241F; } }
:root[data-theme="dark"]{ --papir:#181B17; --tinta:#EDEFE7; --zold:#6FBF92; --narancs:#FF8D4F; --halk:#8f948a; --lap:#20241F; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--papir);color:var(--tinta);
 font-family:'Atkinson Hyperlegible',Verdana,Tahoma,sans-serif}
#lap{max-width:640px;margin:0 auto;padding:24px 20px 56px;min-height:100vh;display:flex;flex-direction:column}
.szam{font-size:15px;font-weight:700;color:var(--narancs);letter-spacing:.08em}
.kep{display:block;width:100%;height:auto;border-radius:8px;margin:14px 0 20px}
.vers{font-size:clamp(20px,5.2vw,26px);line-height:1.5;margin:0 0 20px}
.valasztek{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:12px}
.gomb{font:inherit;font-size:clamp(17px,4.2vw,20px);font-weight:700;text-align:left;
 background:var(--lap);color:var(--zold);border:2px solid var(--zold);border-radius:10px;
 padding:14px 16px;cursor:pointer;line-height:1.35}
.gomb:hover{background:var(--zold);color:var(--papir)}
.gomb:focus-visible{outline:3px solid var(--narancs);outline-offset:2px}
.gomb.fo{color:var(--narancs);border-color:var(--narancs)}
.gomb.fo:hover{background:var(--narancs);color:var(--papir)}
.cim{font-size:clamp(34px,9vw,52px);line-height:1.05;color:var(--zold);margin:8vh 0 0}
.sorozat{font-size:13px;letter-spacing:.2em;color:var(--narancs);margin-bottom:10px}
.alcim{font-size:17px;margin:14px 0 0;color:var(--halk)}
.befejezes{font-size:19px;font-weight:700;color:var(--narancs);margin:6px 0 0}
.lista{list-style:none;padding:0;margin:18px 0 0;font-size:17px;line-height:2}
.lista li{color:var(--halk)}
.lista li.meg{color:var(--tinta);font-weight:700}
.jel{color:var(--narancs);margin-right:10px}
.nyomjel{font-size:16px;font-weight:700;color:var(--narancs);border-top:2px solid var(--narancs);
 padding-top:10px;margin:4px 0 0;letter-spacing:.02em}
</style></head><body><div id="lap"></div>
<script>
const OLDAL = {"1": {"v": [[2, "Odateszed a füled"], [2, "Kinyitod az ajtót"]], "s": [["Tavaly megtaláltad a hetedik fejet, tavasszal felvitted Müzlit egy egész napra, ősszel pedig úgy tűnik, Margót is sikerült meggyőznöd arról, hogy létezünk."], ["Ma reggel más hang jön a pincelejáró alól. Nem kopogás, és nem is beszéd."], ["Korgás.", "Olyan mély és olyan hosszú, hogy a kilincs beleremeg."]], "k": 2, "a": "Zárt pinceajtó a folyosó végén, a fiú fülel, minden más csendes."}, "2": {"v": [[3, "Lapozz tovább"]], "s": [["Odateszed a füled az ajtóra, és a korgás megismétlődik, most még hosszabban."], ["Valami nagyon nagy és nagyon éhes van odabent."], ["Nekifeszülsz az ajtónak, és az kinyílik."], ["A lépcső alján nem sötét van, hanem egy orr. Akkora orr, hogy elállja az egész lejáratot."]]}, "3": {"v": [[4, "Megvárod, mi lesz"], [14, "Megkérdezed, mit szeret"]], "s": [["A harmadik fej az. Ő az, aki mindig éhes, és ő az, aki elalszik attól a szótól, amit most nem mondasz ki."], ["— Éhes vagyok — mondja, és nem kiabál, mert ahhoz is erő kell. — Négyszáz éve alszom. Aki alszik, az nem eszik. Aki felébred, az eszik."]], "k": 3, "a": "Óriási zöld sárkányorr tölti ki a pincelejáró egészét, a fiú kicsi előtte."}, "4": {"v": [[5, "Megkérdezed, mennyi kell neki"], [6, "Felébreszted a hatodik fejet"]], "s": [["Müzli feje mögötte bukkan fel, és most először látod rajta, hogy ideges."], ["— TEGNAP ÓTA ÉBREN VAN — mondja. — ÉS EGYRE NAGYOBB A HANGJA."]]}, "5": {"v": [[6, "Lapozz tovább"]], "s": [["— Mennyi kell neki? — kérdezed."], ["Müzli gondolkodik, ami nála hangos művelet."], ["— AMENNYI EGY OSZTÁLYNAK ELÉG — mondja végül. — EGY EGÉSZ OSZTÁLYNAK. EGYSZERRE."]], "ny": "n01"}, "6": {"v": [[7, "Lapozz tovább"]], "s": [["A hatodik fej félig kinyitja a szemét, mert ő mindig felébred, ha szabályról van szó. Nála a szabályok találós kérdésben vannak, és ez így is marad, amíg ő él."], ["— Ha üres, felkel — mondja. — Ha teli, alszik."], ["— A has — mondod."], ["A hatodik fej bólint, és itt abba kellene hagynia."], ["— Ha nem kap enni addig, amíg be nem zár a konyha, akkor feljön — mondja. — És ő nem tudja, mi számít ételnek egy iskolában."], ["— Eddig mit ettetek? — kérdezed."], ["— Amiből lejutott ide. Régen tele volt a pince: krumpli, alma, zsákok a fal mellett. Már évek óta nincs itt semmi."], ["Aztán félrefordítja a fejét.", "— És ezt sem lett volna szabad elmondanom. De mindig elmondom."]], "ny": "n02"}, "7": {"v": [[8, "Lapozz tovább"]], "s": [["Eszedbe jut, hogy van egy szó, amitől azonnal elalszik. Egyetlen szó, és vége az egésznek."], ["Müzli is rád néz, mert neki is eszébe jutott."], ["— AZT NE — mondja halkan. — HOLNAP MÉG ÉHESEBB LESZ."]], "ny": "n03"}, "8": {"v": [[14, "Megkérdezed, mit szeret"], [15, "Megnézed a nagy lapos követ"], [9, "Megnézed a testvéreit"], [11, "Szólsz Margónak"], [19, "Felmész"]], "s": [["Odalent meleg van, és a harmadik fej olyan lassan mozog, mint aki spórol az erejével."], ["Becsengetésig van még néhány perced."]]}, "9": {"v": [[10, "Lapozz tovább"]], "s": [["A negyedik fej a fal mellett fekszik, és álmában csuklik egyet."], ["A csuklástól megbillen a levegő, és a harmadik fej gyomra válaszol rá egy hosszú korgással."], ["— Ő mindig csuklik — mondja Müzli. — ÉS MINDIG AKKOR, AMIKOR A LEGROSSZABB."], ["Megjegyzed, mert az ilyesmi egyszer még fontos lesz."]]}, "10": {"v": [[17, "Lapozz tovább"]], "s": [["A sarokban ott az ötödik fej, aki soha nem szólal meg, és most is csak néz."], ["Aztán a kőre koppant kétszer az állával."], ["— Mit mondott? — kérdezed."], ["— NEM TUDOM — mondja Müzli. — DE ÉN AZT HISZEM, HOGY AZT MONDTA: SIESS."], ["Lehet, hogy Müzlinek igaza van. Lehet, hogy csak reméli."]]}, "11": {"v": [[12, "Lapozz tovább"]], "s": [["A második fej kinyitja a szemét. Ősz óta van neve, és azóta sokkal nehezebb vele vitatkozni."], ["— Margó — mondod. — Segítesz?"], ["— Attól függ, mi van leírva — mondja Margó."]]}, "12": {"v": [[13, "Lapozz tovább"]], "s": [["Kitép egy lapot a fészkéből, és eléd tolja."], ["— Írd le, mit hozol — mondja. — Amit leírsz, azt meg is kell hozni."], ["Aztán halkan hozzáteszi:", "— Így legalább nem felejted el."]]}, "13": {"v": [[18, "Lapozz tovább"]], "s": [["Felírod a lap tetejére, hogy MIT HOZOK, és alá egy hosszú vonalat húzol."], ["A lap üres.", "Ez most még nem bizonyít semmit, de este majd fog."]], "ny": "n04"}, "14": {"v": [[18, "Lapozz tovább"]], "s": [["— Mit szeretsz? — kérdezed, mert ezt még soha senki nem kérdezte meg tőle."], ["A harmadik fej nagyon sokáig hallgat."], ["— Nem tudom — mondja végül. — Amit kapok."], ["Aztán hozzáteszi, halkabban:", "— Eddig nem kaptam. Eddig mindig elvettem."], ["— Kitől? — kérdezed."], ["— A testvéreimtől — mondja. — Ők alszanak. Én meg nem."], ["Ezt a mondatot egész nap nem tudod elfelejteni."]], "ny": "n05"}, "15": {"v": [[16, "Lapozz tovább"]], "s": [["A fal mellett egy nagy lapos kő hever, és a közepe simára kopott."], ["Olyan, mintha valaki nagyon sokszor tett volna rá valamit."]]}, "16": {"v": [[18, "Lapozz tovább"]], "s": [["— Ez mi? — kérdezed."], ["— A tányérom — mondja a harmadik fej. — Üres."], ["— Miért pont a tiéd? — kérdezed."], ["— Mert mindig én érek ide elsőnek — mondja, és ezt egyáltalán nem büszkén mondja."], ["Te pedig csak állsz ott, és arra gondolsz, hogy ez a kő négyszáz éve üres. Ez most valahogy rosszabb, mint az egész korgás."]], "k": 4, "a": "Nagy lapos kő a pince földjén, a közepe simára kopott, üres.", "ny": "n06"}, "17": {"v": [[18, "Lapozz tovább"]], "s": [["Müzli feléd hajol, és olyan halkan beszél, ahogy csak tud, vagyis elég hangosan."], ["— ÉN ODAADHATOM A SAJÁTOMAT — mondja. — AMI LEJUT IDE, ABBÓL NEKEM IS JÁR EGY RÉSZ. AZT NEKI ADOM."], ["— És te mit eszel? — kérdezed."], ["— MAJD VALAMIT — mondja Müzli, és ez rá egyáltalán nem vall."], ["Nem mondasz rá se igent, se nemet. Egyelőre."]]}, "18": {"v": [[14, "Megkérdezed, mit szeret"], [15, "Megnézed a nagy lapos követ"], [9, "Megnézed a testvéreit"], [11, "Szólsz Margónak"], [19, "Felmész"]], "s": [["Odafentről már hallatszanak a lépések, ahogy megtelik a folyosó."], ["Még egy dolgot megnézhetsz, aztán indulni kell."]]}, "19": {"v": [[20, "Lapozz tovább"]], "s": [["Felmész a lépcsőn, és a korgás még a folyosón is hallatszik, csak halkabban."], ["A radiátor langyos, mint mindig. Tavaly télen a kazán elromlott, és két hónapig két pulóverben ültetek az órákon. Nyáron tettek be újat."], ["Odafent egy teljesen hétköznapi nap kezdődik, tele olyan dolgokkal, amikre eddig soha nem gondoltál úgy, hogy étel."], ["A délelőtti szünetben végigmész a folyosón, és most először számolsz össze mindent, ami ehető ebben a házban."], ["Egy konyha, egy ebédlő, egy kosár tízórai, egy kosár uzsonna, és néhány uzsis doboz, amit otthonról hoznak."], ["Egy iskola tele van étellel. Csak eddig ez soha nem tűnt fel."]], "ny": "n07"}, "20": {"v": [[21, "Lapozz tovább"]], "s": [["Emőke a lépcsőn ül, és halkan énekel magában, mert ő énekel a legszebben köztetek."], ["A korgás pont akkor jön fel a padló alól."], ["Emőke abbahagyja, és lenéz a lábára."], ["— Hallottad? — kérdezi.", "— A fűtés — mondod."], ["— Nem fűtés — mondja Emőke, és tovább énekel, de most hangosabban, hogy ne lehessen hallani, ami alulról jön."], ["Nem kérdez semmit. Csak énekel. Ez most többet ér bárminél."]]}, "21": {"v": [[23, "Megkérdezed, mikor zár a konyha"], [22, "Kinézel az ablakon"], [24, "Bemész az osztályba"]], "s": [["A folyosón Lajos bácsi felmos, és amikor melléd ér, megáll."], ["— Ma hangosabb — mondja, és a pincelejáró felé bök a fejével. — Biztos a fűtés, igaz?"], ["— Biztos — mondod, és közben a cipődet nézed."]], "k": 5, "a": "A gondnok felmos a folyosón, kulcsok az övén, a pinceajtó mögötte."}, "22": {"v": [[24, "Lapozz tovább"]], "s": [["Az ablakból látod, hogy begördül az udvarra egy fehér kisteherautó, és az oldalán egy konyha neve áll."], ["Ládákat pakolnak le róla. Sok ládát."], ["Aztán a sofőr becsukja a hátsó ajtót, és odaszól valakinek:"], ["— Négykor jövök a maradékért!"], ["Négykor. Megint ez az óra."]]}, "23": {"v": [[24, "Lapozz tovább"]], "s": [["— Mikor zár be a konyha? — kérdezed, mintha csak úgy kérdeznéd."], ["— Négykor — mondja Lajos bácsi. — Négykor viszik el az utolsó kocsit, és utána már egy szem kenyér sincs a házban."], ["Most már tudod, mennyi időd van."]], "ny": "n08"}, "24": {"v": [[25, "Lapozz tovább"]], "s": [["Becsengetnek, és belép Márti néni, aki majdnem mindenre tanít titeket, és aki mindig észreveszi, ha valaki máshol jár."], ["Az első óra olvasás, de egy szót sem hallasz belőle, mert azon gondolkodsz, hány szendvics van ebben az iskolában."]]}, "25": {"v": [[26, "Elolvasod a mai cédulát"], [27, "Becsengetnek"]], "s": [["Aztán eszedbe jut a saját dobozod."], ["Nem mindenki hoz ilyet, mert a legtöbben az iskolai tízórait meg uzsonnát eszik. Te viszont minden reggel hozol: dió meg mandula, pár falat gyümölcs, egy pici szendvics, sajt, valami sós és valami édes."], ["És mindig van benne egy cédula is, amit apáék tesznek bele. Minden nap másik."]], "k": 6, "a": "Nyitott uzsonnásdoboz a pad alatt: dió, gyümölcs, sajt, kis szendvics, cédula."}, "26": {"v": [[27, "Lapozz tovább"]], "s": [["Kinyitod a dobozt a pad alatt, és elolvasod a mai cédulát."], ["MA IS MENNI FOG."], ["Visszateszed, mert a cédulát soha nem dobod ki."]], "ny": "n09"}, "27": {"v": [[31, "Előveszed a saját uzsis dobozodat"], [32, "Megnézed a tízórais kosarat"], [33, "Felnézel a szekrény tetejére"], [35, "Benézel a konyhába"]], "s": [["Becsengetés után beviszik a tízórait. Minden nap ugyanaz: egy nagy kosár, benne annyi tízórai, ahány gyerek van."], ["Tizenhat, pont egy osztálynyi."], ["Most először nézel úgy erre a kosárra, mint egy lehetőségre."]], "k": 7, "a": "Nagy fonott kosár tele papírzacskókkal a katedra mellett."}, "28": {"v": [[29, "Lapozz tovább"]], "s": [["Zoé helye üres, mert éppen kiment a mosdóba, amikor behozták a tízórait."], ["Az övé ott áll a padján, és senki nem nyúl hozzá."], ["Egy pillanatig nézed."], ["Aztán eszedbe jut, hogy Zoé nem szereti, ha nélküle döntenek olyasmiről, ami az övé. És ebben igaza is van."], ["Úgyhogy megvárod, amíg visszajön."]], "ny": "n10"}, "29": {"v": [[37, "Lapozz tovább"]], "s": [["Amikor Zoé visszaér, megkérdezed tőle."], ["Végighallgat, aztán vállat von."], ["— Vidd — mondja. — Én úgysem vagyok most éhes."]]}, "30": {"v": [[37, "Lapozz tovább"]], "s": [["A folyosón Simon szalad el melletted, mert Simon mindig szalad, és ő nagyon gyorsan fut."], ["— Segítesz valamiben? — kérdezed.", "— Mennyi idő alatt? — kérdezi vissza."], ["Elmondod, hogy a konyha és a pincelejáró között kéne valamit átvinni, sokszor, feltűnés nélkül."], ["Simon elvigyorodik."], ["— Én vagyok a leggyorsabb — mondja. — Mire valaki odanéz, már nem vagyok ott."]]}, "31": {"v": [[37, "Lapozz tovább"]], "s": [["Kinyitod a saját dobozodat, és kiveszed belőle a sajtot."], ["Nem nagy darab. Egy sárkánynak semmi."], ["De ez az első, amit ma valaki önként ad neki."]], "ny": "n11"}, "32": {"v": [[28, "Lapozz tovább"]], "s": [["A kosár a tanári asztal mellett áll, és Márti néni éppen kimegy a folyosóra."], ["Megvárod, amíg mindenki elveszi a sajátját, és a kosár kiürül."], ["Nem marad benne semmi. Soha nem marad, mert pontosan annyit hoznak, ahányan aznap bejöttök."], ["Ebből az útból nem lesz semmi. Itt minden falatnak van gazdája."]], "ny": "n12"}, "33": {"v": [[34, "Lapozz tovább"]], "s": [["A terem hátuljában, a szekrény tetején ott a nagy kosár, amiben reggel a tízórait hozzák. Üresen felejtik ott minden nap."], ["Magasan van. Nagyon magasan."], ["Marci a legmagasabb köztetek, és fél kézzel leveszi, oda se néz."], ["— Mire kell? — kérdezi.", "— Hogy legyen miben levinni — mondod.", "Marci bólint, mintha ez teljesen rendben lenne."]], "k": 8, "a": "A legmagasabb gyerek lenyúl egy kosárért a szekrény tetejéről.", "ny": "n13"}, "34": {"v": [[37, "Lapozz tovább"]], "s": [["Bálint az osztály bohóca, és most éppen azon dolgozik, hogy mindenki őt nézze."], ["Ez ma nagyon jól jönne."], ["Megkéred, hogy csináljon valamit, amitől mindenki hátrafordul."], ["Bálint nem kérdez semmit, csak elvigyorodik, és egy perc múlva az egész osztály a plafont nézi, mert felragadt rá egy takonylabda."], ["Ennyi idő pont elég."]]}, "35": {"v": [[36, "Elmondod neki, kinek kell"], [38, "Nem szólsz semmit, és továbbmész"]], "s": [["Az ebédlő végében nyitva a konyhaajtó, és bentről meleg pára gomolyog ki."], ["A konyhás néni egy akkora fazekat kavar, amiben elférnél."], ["— Mi lesz a maradékkal? — kérdezed."], ["— Elviszik — mondja. — Négykor jön a kocsi, és mindent elvisz."], ["— És ha valaki megenné?", "— Akkor jöjjön, és egye meg — mondja, és nevet, mert viccnek gondolja."]]}, "36": {"v": [[38, "Lapozz tovább"]], "s": [["— Nem viccnek mondtam — mondod. — Tényleg van valaki, aki megenné."], ["A konyhás néni leteszi a fakanalat, és most először rád néz rendesen."], ["— Mekkora? — kérdezi.", "— Nagy — mondod. — Nagyon nagy."], ["Sokáig hallgat, aztán annyit mond:", "— Négyig itt vagyok. Ha kell, szólj."]], "ny": "n14"}, "37": {"v": [[31, "Előveszed a saját uzsis dobozodat"], [32, "Megnézed a tízórais kosarat"], [33, "Felnézel a szekrény tetejére"], [35, "Benézel a konyhába"], [39, "Jön az ebéd"]], "s": [["A kosár még itt van, és a szünetből is maradt pár perc."], ["Odalent közben nem történik semmi, és pont ez a baj."]]}, "38": {"v": [[30, "Lapozz tovább"]], "s": [["A tanári ajtaja mögül kávészag jön, és a tanárok éppen most tartanak szünetet."], ["Az asztalon ott a nagy kekszes doboz, amiből mindenki vesz egyet, és soha nem fogy el."]], "ny": "n15"}, "39": {"v": [[43, "Kérsz repetát a konyhás nénitől"], [44, "Megnézed, mi maradt az asztalokon"], [45, "Megkérdezed Márti nénit, mi lesz a maradékkal"], [46, "Kimész körülnézni a folyosóra"], [47, "Megállsz a hirdetőtáblánál"]], "s": [["Ebéd. Leves, utána húsi szósszal."], ["A terem akkora zajt ad, hogy a saját gondolataidat sem hallod."], ["A tálalópult mögött annyi étel van, amennyit életedben nem láttál egy helyen."]], "k": 9, "a": "Iskolai ebédlő tálalópulttal, gőzölgő fazekakkal, sorban álló gyerekekkel."}, "40": {"v": [[49, "Lapozz tovább"]], "s": [["Az ebédlő végében ott a nagy szemetes, és ebéd után mindenki oda viszi a tálcáját."], ["Megállsz mellette, és belenézel."], ["Fél tálca rizs. Egy egész kifli. Három leveses tányér, amikből két kanálnyit ettek."], ["Eddig minden nap láttad ezt, és eddig egyszer sem láttad meg."], ["Odalent valaki négyszáz éve nem evett semmit."]], "ny": "n16"}, "41": {"v": [[49, "Lapozz tovább"]], "s": [["A pult végén ott a kenyereskosár, és ebéd végén mindig marad benne."], ["A konyhás néni a fejével int, hogy vihetsz, ha kell."], ["Nyolc szelet kenyeret teszel a zsebedbe, és a zsebed kenyérszagú lesz."], ["Egész délután érezni fogod."], ["Nem is baj."]], "ny": "n17"}, "42": {"v": [[49, "Lapozz tovább"]], "s": [["Levi és Dani egymás mellett ülnek az ebédnél, mert ők ketten mindig egymás mellett ülnek."], ["Levi rád néz azzal a nézéssel, amiből tudod, hogy már mindent kitalált."], ["— Megint van valami — mondja. — Kell segítség?"], ["— Cipelni kell — mondod."], ["Dani bólint, és nem kérdez semmit, mert neki mindig van türelme kivárni, amíg kiderül, miről van szó."], ["Hárman háromszor annyit visznek, mint egy ember, és ezt eddig nem gondoltad végig."]], "ny": "n18"}, "43": {"v": [[41, "Lapozz tovább"]], "s": [["A pult mögött ott áll a konyhás néni, és tőle lehet repetát kérni, ha valaki még éhes."], ["Négyszer mész vissza, és a negyediknél már ő is figyel."], ["— Hova fér ez beléd? — kérdezi."], ["— Nem belém — mondod. — Valaki másnak viszem."], ["A konyhás néni rád néz, aztán még tesz egy merőkanállal. Nem kérdez semmit."]], "ny": "n19"}, "44": {"v": [[40, "Lapozz tovább"]], "s": [["Az asztal végén ott hever a délelőtti tízórai fele. Van, amit meg sem kezdtek."], ["Ebédnél már senki nem eszi meg, ami reggelről maradt."], ["Összeszeded, amit otthagytak. Hét adag lesz belőle."], ["Senki nem szól rád, mert azt hiszik, elpakolsz."], ["Hét tízórai egy sárkánynak annyi, mint neked hét mazsola.", "A semminél jobb, de nem sokkal."]], "ny": "n20"}, "45": {"v": [[42, "Lapozz tovább"]], "s": [["Márti néni az asztal végén ül, és a saját ebédjét eszi, ami ugyanaz, mint a tiétek."], ["— Márti néni — kérdezed —, mi történik azzal, ami megmarad?"], ["Márti néni leteszi a villát, és ez azt jelenti, hogy a kérdés jó volt."], ["— Semmi jó — mondja. — Elviszik. Minden nap."], ["Aztán rád néz.", "— Miért, tudsz jobbat?"]], "ny": "n21"}, "46": {"v": [[49, "Lapozz tovább"]], "s": [["Kincső a folyosó végén guggol, a lépcső alatti résben, mert Kincső mindenhol megtalálja azt a helyet, ahová el lehet bújni."], ["— Mit keresel? — kérdezi.", "— Ennivalót — mondod."], ["Kincső elgondolkodik, aztán felragyog az arca."], ["— Az uzsonnás kosár — mondja. — Egykor már kint áll a konyha mellett, de csak kettőkor osztják ki."], ["— Egy óra, amíg ott áll? — kérdezed.", "— Egy óra — mondja Kincső."]], "ny": "n22"}, "47": {"v": [[48, "Továbbmész"], [77, "Lemész, és kimondod"]], "s": [["A folyosón elmész a hirdetőtábla mellett, és ott van kitűzve a papír, amit minden évben kitesznek."], ["FOGORVOS. KEDDEN. MINDENKI JÖN."], ["Elég lenne kimondani ezt a szót odalent."]]}, "48": {"v": [[49, "Lapozz tovább"]], "s": [["Egy pillanatra tényleg elgondolkodsz rajta."], ["Aztán eszedbe jut, hogy mit mondott Müzli: holnap még éhesebb lesz."], ["Meg az is, hogy a harmadik fej ma először mondta ki hangosan, hogy soha nem kapott még semmit."]]}, "49": {"v": [[43, "Kérsz repetát a konyhás nénitől"], [44, "Megnézed, mi maradt az asztalokon"], [45, "Megkérdezed Márti nénit, mi lesz a maradékkal"], [46, "Kimész körülnézni a folyosóra"], [50, "Vége az ebédnek"]], "s": [["Még ülhetsz egy kicsit, mert a második osztály mindig utoljára megy ki az ebédlőből."], ["Az órára nézel. Fél kettő."]]}, "50": {"v": [[56, "Bemész a napközis terembe Ági nénihez"], [53, "Megnézed, mit csinálnak az uzsonnával"], [60, "Visszamész az osztálytársaidhoz"], [55, "Lemész megnézni a harmadik fejet"], [54, "Bemész Márti nénihez segítséget kérni"]], "s": [["Fél háromkor az iskola lelassul. A felsősök hazamennek, a folyosók kiürülnek, és a napköziben megterítenek."], ["Másfél óra van négyig."]]}, "51": {"v": [[63, "Lapozz tovább"]], "s": [["Odalent megkérdezed tőle, hogy hívják."], ["A harmadik fej olyan arcot vág, mint akinek ez soha nem jutott eszébe."], ["— Nekem nincs nevem — mondja. — Müzlinek van, mert ő kitalálta magának."], ["— És te miért nem találtál ki?", "— Mert ahhoz olyan szó kell, amit szeretek — mondja. — Én meg eddig egy szót sem szerettem."]], "ny": "n23"}, "52": {"v": [[65, "Lapozz tovább"]], "s": [["Háromkor leülsz egy padra a folyosón, és nézed az órát."], ["Hatvan perc. Ennyi maradt, és attól, hogy nézed, nem lesz több."], ["Levi melléd ül, és egy darabig egyikőtök sem szól."], ["— Mi lesz, ha nem elég? — kérdezi végül."], ["— Akkor feljön — mondod."], ["Levi bólint, és nem mondja azt, hogy az izgalmas lenne, pedig más biztosan azt mondaná."]]}, "53": {"v": [[58, "Lapozz tovább"]], "s": [["Egykor kitolják a folyosóra az uzsonnás kosarat, és letakarják egy fehér kendővel."], ["Aztán egy órán át senki nem nyúl hozzá."], ["Odaállsz mellé, és megszámolod, hány zsemle van alatta."], ["Pont annyi, ahányan vagytok.", "Pont annyi, amennyi hiányozna."]]}, "54": {"v": [[52, "Lapozz tovább"]], "s": [["Márti néni az üres teremben pakol, és amikor belépsz, felnéz."], ["— Egész nap máshol jártál — mondja. — Mi van veled?"], ["Nem mondod el az egészet, csak annyit, hogy valaki nagyon éhes, és nem tudod, honnan lesz elég."], ["Márti néni sokáig néz rád."], ["— Az én időmben azt tanultuk, hogy aki éhes, annak adni kell — mondja."], ["Aztán kinyitja az alsó fiókot, és kivesz belőle egy doboz pogácsát."]], "ny": "n24"}, "55": {"v": [[51, "Lapozz tovább"]], "s": [["Lemész egy percre, csak megnézni."], ["A harmadik fej nem mozdul, és ez rosszabb, mint amikor korgott."], ["— Nem kell — mondja, amikor meglát. — Ne fáradj."], ["Nem azért mondja, mert nem éhes. Hanem mert egész nap hallotta a lépéseidet odafentről, és rájött, hogy amit lehozol, azt valakitől el kell kérni."], ["Ettől leszel biztos benne, hogy meg fogod csinálni."]], "ny": "n25"}, "56": {"v": [[57, "Megkéred, hogy jöjjön le veled"], [65, "Csak maradsz a napköziben"]], "s": [["A napközis teremben Ági néni éppen székeket rakosgat. Ő tartja a napközit, és ő az, aki délután mindenkit számon tart."], ["— Te nem mész haza? — kérdezi.", "— Maradok — mondod."], ["Ági néni bólint, és feljegyzi a füzetébe, mert nála minden fel van jegyezve."], ["Az asztal végén ott az uzsonna maradéka, mert a napköziben mindig marad, ha valakiért korábban jönnek."], ["— Négyig itt vagyunk — mondja. — Addig ez a miénk."]], "ny": "n26"}, "57": {"v": [[65, "Lapozz tovább"]], "s": [["Elmondod neki, hogy van odalent valaki, aki egész nap nem evett."], ["Ági néni nem kérdezi meg, hogy kicsoda. Csak becsukja a füzetét."], ["— Négykor lemegyünk — mondja. — És viszünk neki valamit."]], "ny": "n27"}, "58": {"v": [[59, "Lapozz tovább"]], "s": [["A konyha melletti kis folyosón ott áll az uzsonnás kosár, letakarva egy fehér kendővel."], ["Senki nem őrzi. Senkinek nem jut eszébe, hogy őrizni kéne."]]}, "59": {"v": [[65, "Lapozz tovább"]], "s": [["Felemeled a kendő sarkát."], ["Zsemlék. Vaj. Alma. Egy egész osztálynak elég."], ["Ha most elviszed, négykor tizenhat gyerek nem kap uzsonnát, és te pontosan tudod, hogy melyik tizenhat."]], "k": 10, "a": "Fehér kendővel letakart kosár egy üres folyosón, a kendő sarka felhajtva.", "ny": "n28"}, "60": {"v": [[61, "Megkérdezed őket"], [65, "Mégsem szólsz"]], "s": [["Visszamész a terembe, ahol még ott ül a fél osztály, mert a napközi mindjárt kezdődik."], ["Meg lehetne kérdezni őket. Mind a tizenötöt."]]}, "61": {"v": [[62, "Lapozz tovább"]], "s": [["Nehezebb kimondani, mint gondoltad, mert ez az a fajta mondat, amitől vagy elhisznek valamit, vagy kinevetnek."], ["— Kéne egy kis kaja — mondod. — Nem nekem."], ["Bálint az osztály bohóca, és most mégis ő kérdez vissza elsőnek, egyáltalán nem gúnyosan:", "— Kinek?"]]}, "62": {"v": [[65, "Lapozz tovább"]], "s": [["Elmondod. Az egészet, az elejétől."], ["Nem nevet ki senki. Marci, aki a legmagasabb köztetek, csak bólint egyet. Kincső, aki minden rejtekhelyet ismer az iskolában, rögtön tudja, honnan lehetne szerezni valamit."], ["Bálint feláll, és kifordítja a zsebét.", "— Nálam van két szalámis kifli — mondja. — Tessék."], ["Márti néni az ajtóból nézi, aztán szó nélkül bemegy, és kihozza az alsó fiókból a pogácsás dobozt."]], "k": 11, "a": "Gyerekek egy padra pakolják egymás mellé, amijük van.", "ny": "n29"}, "63": {"v": [[64, "Elfogadod, amit felajánl"], [65, "Azt mondod, hogy nem kell"]], "s": [["A pincelejárónál Müzli vár, és látszik rajta, hogy egész nap ezen gondolkodott."], ["— ODAADOM A RÉSZEMET — mondja. — MINDIG. MINDENNAP."], ["— Akkor te maradsz éhen — mondod."], ["— IGEN — mondja Müzli. — DE ÉN LEGALÁBB TUDOM, MILYEN AZ, AMIKOR KAPOK VALAMIT."], ["Ilyen csendesen még soha nem beszélt."]]}, "64": {"v": [[65, "Lapozz tovább"]], "s": [["— Jó — mondod. — De csak ma."], ["— MINDENNAP — mondja Müzli.", "— Csak ma — mondod megint."], ["Müzli nem vitatkozik tovább, ami nála a legnagyobb dolog, amire képes."]], "ny": "n30"}, "65": {"v": [[56, "Bemész a napközis terembe Ági nénihez"], [53, "Megnézed, mit csinálnak az uzsonnával"], [60, "Visszamész az osztálytársaidhoz"], [55, "Lemész megnézni a harmadik fejet"], [54, "Bemész Márti nénihez segítséget kérni"], [67, "Tíz perc van négyig"]], "s": [["Az óra a folyosón ketyeg, és minden perccel nehezebb a táskád meg a gyomrod."], ["Odalent már csak a korgás hallatszik. Beszéd nem."]]}, "66": {"v": [[68, "Lapozz tovább"]], "s": [["Négy óra előtt tíz perccel indulsz lefelé."], ["A lépcső alján ott a nagy lapos kő, és a harmadik fej fölötte vár."], ["Most nem korog. Ez rosszabb."]]}, "67": {"v": [[66, "Lapozz tovább"]], "s": [["Mielőtt lemennél, a lépcső tetején kiforgatod a zsebeidet, és megnézed, mi jött össze a mai napból."], ["Kevesebbnek látszik, mint amennyinek egész nap érezted."]]}, "68": {"v": [[69, "Megnézed, mi maradt a dobozodban"], [71, "Kirakod, amit hoztál"]], "s": [["Odafentről lépések, ajtócsapódás, és a folyosón elindul egy kocsi kereke."], ["Négy óra.", "Most már nincs honnan hozni semmit."]]}, "69": {"v": [[70, "Lapozz tovább"]], "s": [["Négy óra előtt már alig van valami az uzsis dobozodban. Ami volt benne, az mind elfogyott vagy lement a lépcsőn."], ["Csak a cédula van a doboz alján."], ["— Az mi? — kérdezi a harmadik fej."], ["— Egy cédula — mondod. — Apáék adják. Minden nap másikat."], ["— És mi van rajta? — kérdezi.", "— Nem tudod elolvasni? — kérdezel vissza."], ["— Nem — mondja a harmadik fej. — Én soha nem tanultam meg."]]}, "70": {"v": [[71, "Lapozz tovább"]], "s": [["Felolvasod neki."], ["MA IS MENNI FOG."], ["A harmadik fej sokáig hallgat, aztán annyit mond:"], ["— Ezt nekem is írták?", "— Ma igen — mondod."]], "ny": "n31"}, "71": {"v": [[72, "Az egész osztály összedobta"], [73, "A konyhás nénit is bevontad"], [74, "Ági nénivel jöttél le"], [75, "Müzli adja oda a sajátját"], [76, "Nincs nálad elég"]], "s": [["Letérdelsz a kő mellé, és kirakod, amit hoztál."], ["A harmadik fej nem kap utána. Vár."], ["Négyszáz éve nem kapott semmit, és most nem akarja elrontani."], ["Ha több is igaz közülük, akkor is csak az egyiket választhatod: azt, ami ma a legtöbbet számít."]]}, "72": {"v": [], "s": [["Egyenként rakjátok a kőre, amit hoztatok."], ["Bálint a két szalámis kiflijét. Marci azt, amit otthonról hozott. Kincső a sajátját, és még Zoéét is, aki nem volt éhes. A többiek, ami maradt a tízóraijukból."], ["És mindenki ugyanazt mondja közben, mert így szokás:", "— Tessék."], ["A harmadik fej eszik, lassan, és közben minden falat után felnéz."], ["A végén megszólal:", "— Mi az, hogy tessék?"], ["— Az azt jelenti, hogy neked adom — mondod."], ["Sokáig hallgat.", "— Akkor ez a nevem — mondja. — Tessék."], ["És attól a naptól kezdve így hívják."]], "b": [1, "Tessék"], "k": 12, "a": "Nagy lapos kő tele apró ételekkel, fölötte egy hatalmas fej lehajtva."}, "73": {"v": [], "s": [["Szólsz neki, ahogy megbeszéltétek, és a konyhás néni nem kérdez vissza."], ["Leteszi a fakanalat, és annyit mond:", "— Mennyi?"], ["— Egy osztálynyi."], ["— Az nekem semmi — mondja a konyhás néni."], ["Négykor nem viszi el a kocsi a maradékot. Négykor lemegy a pincébe egy lábas, aztán még egy."], ["Azóta az iskolában soha semmi nem megy a kukába, és senki nem tudja, miért."]], "b": [2, "A konyha"]}, "74": {"v": [], "s": [["Ági nénivel mentek le, és ő viszi, ami az uzsonnából megmaradt."], ["Nem ijed meg. Megnézi a harmadik fejet, aztán elővesz egy füzetet, és felírja a nevét a napközis listára."], ["— Aki itt eszik, az be van írva — mondja."], ["Azóta, ha valami megmarad az uzsonnából, Ági néni nem teszi el másnapra."], ["A harmadik fej pedig minden délután megkérdezi, hogy mi lesz holnap."]], "b": [3, "A napközi"]}, "75": {"v": [], "s": [["Müzli odatolja a nagy lapos kőre azt, ami az ő része lett volna, és félreáll."], ["A harmadik fej ránéz, aztán megeszi, mert ennyire éhes."], ["Aztán a negyedik fej is odatolja a magáét. Aztán az ötödik. Aztán mind."], ["Öt fej marad éhen, hogy egy jóllakjon, és ezt senki nem mondja ki hangosan."], ["Most először nem ő ért oda elsőnek. Most először odaadták neki."], ["Müzli másnap reggel nem kiabál. Egész nap nem."], ["Ez a legrosszabb hang, amit valaha hallottál tőle."]], "b": [4, "Müzli tányérja"]}, "76": {"v": [], "s": [["Négykor elindul az udvarról az utolsó kocsi, és abban a percben a pincelejáró ajtaja kifordul a keretéből."], ["A harmadik fej feljön a folyosóra, és nem gonosz, csak éhes, ami sokkal ijesztőbb."], ["Megeszi a faliújságot, két kabátot és a tornateremből egy egész zsák szivacslabdát."], ["Másnap az egész iskola arról beszél, hogy éjjel betörtek."], ["Te tudod, hogy nem törtek be. És azt is tudod, hogy a te hibád."]], "b": [5, "Feljön"]}, "77": {"v": [], "s": [["Kimondod a szót."], ["A harmadik fej szeme lecsukódik, a feje lassan oldalra dől, és a korgás elhallgat."], ["Csend lesz, és a csend egy pillanatra megkönnyebbülés."], ["Müzli nem szól semmit. Csak néz rád, aztán a testvérére, aztán megint rád."], ["Másnap reggel a korgás hangosabb, mint ma volt."], ["Holnapután még hangosabb lesz."]], "b": [6, "A varázsszó"]}};
const VEGEK = [[1, "Tessék"], [2, "A konyha"], [3, "A napközi"], [4, "Müzli tányérja"], [5, "Feljön"], [6, "A varázsszó"]];

const NYOMOK = [["n01", "Egy osztálynyi"], ["n02", "A szabály"], ["n03", "A varázsszó"], ["n04", "A lista"], ["n05", "Eddig mindig elvettem"], ["n06", "Az üres tányér"], ["n07", "Egy iskola tele van étellel"], ["n08", "Négykor zár a konyha"], ["n09", "A mai cédula"], ["n10", "Megkérdezni, nem elvenni"], ["n11", "A sajt"], ["n12", "Pont annyi, ahányan vagytok"], ["n13", "A nagy kosár"], ["n14", "A konyhás néni tudja"], ["n15", "A kekszes doboz"], ["n16", "Amit kidobnak"], ["n17", "Nyolc szelet kenyér"], ["n18", "Levi és Dani"], ["n19", "Négy repeta"], ["n20", "Hét otthagyott tízórai"], ["n21", "Tudsz jobbat?"], ["n22", "Az uzsonnás kosár helye"], ["n23", "Nincs neve"], ["n24", "Márti néni pogácsája"], ["n25", "Ne fáradj"], ["n26", "Ági néni listája"], ["n27", "Ági néni lejön"], ["n28", "A letakart kosár"], ["n29", "Az osztály összedobja"], ["n30", "Müzli felajánlása"], ["n31", "A felolvasott cédula"]];
const KULCS = "mk:v1:ehes:veg";
const KULCS_NY = "mk:v1:ehes:nyom";
let talalt = new Set();
let nyomok = new Set();
try{ const m = localStorage.getItem(KULCS); if(m) talalt = new Set(JSON.parse(m)); }catch(e){}
try{ const m = localStorage.getItem(KULCS_NY); if(m) nyomok = new Set(JSON.parse(m)); }catch(e){}

/* --- egyszeri átvétel a régi kulcsokról + számláló-védelem --------------
   A nyomokat azonosító (n01, n02...) jelöli, nem a szövegük, ezért a
   szöveg bármikor átírható anélkül, hogy az olvasó elveszítené. -------- */
const NYID = new Set(NYOMOK.map(x=>x[0]));
const VEGID = new Set(VEGEK.map(x=>x[0]));
(function(){
  try{
    const cimke = new Map(NYOMOK.map(([i,c])=>[c,i]));
    const regi = localStorage.getItem("ehes-nyomok");
    if(regi) JSON.parse(regi).forEach(x=>{
      if(NYID.has(x)) nyomok.add(x); else if(cimke.has(x)) nyomok.add(cimke.get(x));
    });
    const regiV = localStorage.getItem("ehes-befejezesek");
    if(regiV) JSON.parse(regiV).forEach(x=>{ if(VEGID.has(x)) talalt.add(x); });
  }catch(e){}
  nyomok = new Set([...nyomok].filter(x=>NYID.has(x)));
  talalt = new Set([...talalt].filter(x=>VEGID.has(x)));
})();
function ment(){ try{ localStorage.setItem(KULCS, JSON.stringify([...talalt]));
  localStorage.setItem(KULCS_NY, JSON.stringify([...nyomok])); }catch(e){} }
const lap = document.getElementById("lap");
function el(t,c,sz){ const e=document.createElement(t); if(c) e.className=c; if(sz) e.textContent=sz; return e; }
function cimlap(){
  lap.innerHTML="";
  lap.appendChild(el("div","sorozat","NEGYEDIK KÖNYV"));
  const h=el("h1","cim"); h.innerHTML="A harmadik fej<br>éhes"; lap.appendChild(h);
  if(KEPEK[1]){ const im=document.createElement("img"); im.className="kep"; im.src=KEPEK[1]; im.alt=""; lap.appendChild(im); }
  lap.appendChild(el("p","alcim","Te döntöd el, mi történik. Hat befejezés van, és huszonkilenc nyom."));
  const v=el("div","valasztek");
  const a=el("button","gomb fo","Kezdjük!"); a.onclick=()=>mutat(1); v.appendChild(a);
  const b=el("button","gomb","Befejezések ("+talalt.size+"/"+VEGEK.length+")"); b.onclick=gyujtemeny; v.appendChild(b);
  const c=el("button","gomb","Nyomok ("+nyomok.size+"/"+NYOMOK.length+")"); c.onclick=nyomlap; v.appendChild(c);
  lap.appendChild(v);
}
function gyujtemeny(){
  lap.innerHTML="";
  lap.appendChild(el("div","szam", talalt.size+" / "+VEGEK.length));
  lap.appendChild(el("h1","cim","Befejezések"));
  const ol=el("ul","lista");
  VEGEK.forEach(([n,cim])=>{
    const megvan=talalt.has(n);
    const li=el("li", megvan?"meg":"");
    const j=el("span","jel", megvan?"✓":"·"); li.appendChild(j);
    li.appendChild(document.createTextNode(megvan? n+". "+cim : n+". ?"));
    ol.appendChild(li);
  });
  lap.appendChild(ol);
  const v=el("div","valasztek");
  const a=el("button","gomb fo","Vissza a címlapra"); a.onclick=cimlap; v.appendChild(a);
  lap.appendChild(v);
}
function nyomlap(){
  lap.innerHTML="";
  lap.appendChild(el("div","szam", nyomok.size+" / "+NYOMOK.length));
  lap.appendChild(el("h1","cim","Nyomok"));
  lap.appendChild(el("p","alcim","Egy olvasással nem fér bele mind."));
  const ol=el("ul","lista");
  NYOMOK.forEach(([nyid,cim])=>{
    const megvan=nyomok.has(nyid);
    const li=el("li", megvan?"meg":"");
    const j=el("span","jel", megvan?"✓":"·"); li.appendChild(j);
    li.appendChild(document.createTextNode(megvan? cim : "?"));
    ol.appendChild(li);
  });
  lap.appendChild(ol);
  const v=el("div","valasztek");
  const a=el("button","gomb fo","Vissza a címlapra"); a.onclick=cimlap; v.appendChild(a);
  lap.appendChild(v);
}
function mutat(sz){
  const o=OLDAL[sz]; lap.innerHTML=""; window.scrollTo(0,0);
  lap.appendChild(el("div","szam",sz+". oldal"));
  if(o.k && KEPEK[o.k]){ const im=document.createElement("img"); im.className="kep";
    im.src=KEPEK[o.k]; im.alt=o.a||""; lap.appendChild(im); }
  o.s.forEach(sorok=>{ const p=el("p","vers"); p.innerHTML=sorok.join("<br>"); lap.appendChild(p); });
  if(o.ny){
    const ujE = !nyomok.has(o.ny);
    nyomok.add(o.ny); ment();
    lap.appendChild(el("p","nyomjel",(ujE?"Új nyom: ":"Nyom: ")+o.ny));
  }
  const v=el("div","valasztek");
  if(o.b){
    talalt.add(o.b[0]); ment();
    lap.appendChild(el("p","befejezes",o.b[0]+". befejezés: "+o.b[1]));
    const a=el("button","gomb fo","Újra az elejéről"); a.onclick=()=>mutat(1); v.appendChild(a);
    const b=el("button","gomb","Befejezések ("+talalt.size+"/"+VEGEK.length+")"); b.onclick=gyujtemeny; v.appendChild(b);
  const c=el("button","gomb","Nyomok ("+nyomok.size+"/"+NYOMOK.length+")"); c.onclick=nyomlap; v.appendChild(c);
  } else {
    o.v.forEach(([cel,szoveg])=>{
      const b=el("button","gomb"+(o.v.length===1?" fo":""),szoveg);
      b.onclick=()=>mutat(cel); v.appendChild(b);
    });
  }
  lap.appendChild(v);
}
cimlap();
</script></body></html>
