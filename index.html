<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A hetedik fej — lapozgatós kalandkönyv gyerekeknek">
<title>A hetedik fej</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@300;400;600&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
:root{--papir:#E9EEE6;--papir2:#DDE4D9;--tinta:#1B2A25;--halvany:#4C5F57;--zold:#2F7A4F;
  --lang:#C6461F;--vonal:#C3CEBD;--tabla:#22362E;--kreta:#F3F5EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papir:#151E1A;--papir2:#1D2823;--tinta:#E6EDE5;--halvany:#9FB1A6;--zold:#63BF8B;
  --lang:#FF7A4D;--vonal:#33443B;--tabla:#0F1714}}
*{box-sizing:border-box}
body{margin:0;background:var(--papir);color:var(--tinta);
  font-family:"Lexend",system-ui,-apple-system,sans-serif;font-weight:300;-webkit-text-size-adjust:100%}
.keret{max-width:40rem;margin:0 auto;padding:1rem 1.1rem 3rem;min-height:100vh;display:flex;flex-direction:column}
h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(2.8rem,13vw,4.6rem);
  line-height:.95;margin:.4rem 0 .8rem;color:var(--kreta)}
.cim{background:var(--tabla);color:var(--kreta);border-radius:.8rem;padding:2rem 1.4rem;text-align:center}
.cim .sorozat{color:#8FC7A5;letter-spacing:.06em;font-size:.9rem;margin:0}
.cim p{color:#B9CFC0;line-height:1.5;margin:0 0 1.3rem}
.cim img{width:100%;border-radius:.45rem;display:block;margin:0 0 1.4rem}
.gomb{display:block;width:100%;text-align:left;font-family:"Lexend",sans-serif;font-weight:400;
  font-size:1.3rem;line-height:1.35;color:var(--tinta);background:var(--papir2);
  border:2px solid var(--vonal);border-radius:.8rem;padding:.85rem 1rem;margin:0 0 .65rem;cursor:pointer}
.gomb:hover,.gomb:focus-visible{border-color:var(--zold);color:var(--zold)}
.gomb.fo{background:var(--zold);border-color:var(--zold);color:var(--papir);text-align:center;font-weight:600}
.gomb.fo:hover{background:var(--tinta);border-color:var(--tinta);color:var(--papir)}
.kep{width:100%;border-radius:.6rem;display:block;margin:0 0 1.2rem}
.szoveg{font-size:1.6rem;line-height:1.45;font-weight:400;flex:1}
.szoveg p{margin:0 0 1.1rem}
.valasztas{margin-top:1.6rem}
.fejlec{display:flex;align-items:center;gap:.7rem;margin:0 0 1rem;font-size:.9rem;color:var(--halvany)}
.mini{font-family:"Lexend",sans-serif;font-size:.85rem;color:var(--halvany);background:none;
  border:2px solid var(--vonal);border-radius:.5rem;padding:.25rem .7rem;cursor:pointer}
.mini:hover{border-color:var(--zold);color:var(--zold)}
.mini.aktiv{background:var(--zold);border-color:var(--zold);color:var(--papir)}
.jobbra{margin-left:auto}
.vegzet{font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--lang);font-size:1.6rem;
  margin:0 0 .3rem;line-height:1.15}
.vegzet small{display:block;font-family:"Lexend",sans-serif;font-weight:300;font-size:.9rem;
  color:var(--halvany);margin-top:.2rem}
.lista{list-style:none;padding:0;margin:1rem 0 0;font-size:1.15rem}
.lista li{border-bottom:2px solid var(--vonal);padding:.55rem 0;display:flex;gap:.8rem;
  align-items:center;color:var(--halvany)}
.lista li.meg{color:var(--tinta)}
.lista .sz{font-family:"Baloo 2",sans-serif;font-weight:800;min-width:1.7rem}
.lista .pipa{margin-left:auto;color:var(--zold);font-weight:600}
.szamlalo{font-size:1.05rem;color:var(--halvany);margin:.2rem 0 0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--lang);outline-offset:2px}

/* szerkesztő */
.sav{position:sticky;top:0;z-index:5;background:var(--tabla);color:var(--kreta);
  margin:-1rem -1.1rem 1rem;padding:.6rem 1.1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.sav .mini{color:#B9CFC0;border-color:#3E6B53}
.sav .mini:hover{border-color:#8FC7A5;color:#fff}
.sav .allapot{font-size:.8rem;color:#8FC7A5;margin-left:auto}
.szerk{width:100%;font-family:"Lexend",sans-serif;font-weight:400;font-size:1.25rem;line-height:1.45;
  color:var(--tinta);background:var(--papir2);border:2px dashed var(--vonal);border-radius:.6rem;
  padding:.8rem;resize:vertical;margin:0 0 1rem}
.szerk:focus{border-color:var(--zold);border-style:solid}
.sor{display:flex;gap:.5rem;align-items:center;margin:0 0 .5rem}
.sor input{flex:1;font-family:"Lexend",sans-serif;font-size:1.15rem;color:var(--tinta);
  background:var(--papir2);border:2px dashed var(--vonal);border-radius:.6rem;padding:.6rem .8rem}
.sor input:focus{border-color:var(--zold);border-style:solid}
.sor .ugras{flex:none;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1rem;
  background:var(--tinta);color:var(--papir);border:0;border-radius:.5rem;padding:.55rem .8rem;cursor:pointer}
.sor .ugras:hover{background:var(--zold)}
.sugo{font-size:.85rem;line-height:1.5;color:var(--halvany);background:var(--papir2);
  border-left:4px solid var(--zold);border-radius:.4rem;padding:.7rem .9rem;margin:0 0 1.2rem}
.cimke{font-size:.8rem;color:var(--halvany);margin:0 0 .35rem;letter-spacing:.04em}
@media (max-width:30rem){.szoveg{font-size:1.4rem}.gomb{font-size:1.18rem}}
</style>
</head>

<script type="application/json" id="konyv-adat">{"oldalak": {"1": {"t": [["Tízórai szünet van, és a folyosón mindenki rohan."], ["A túlsó végén Feri bácsi felmos. Ő a gondnok. Ő javít meg mindent, ami elromlik az iskolában."], ["Melletted elmegy az igazgató úr. A nyakán sál van, pedig odakint süt a nap. Nyáron is sálat hord, télen is, és senki nem tudja, miért."], ["A labda kipattan a kezedből, végiggurul a folyosón, és legurul a pincelejárón."], ["Bumm. Bumm. Bumm.", "Aztán csend."]], "v": [[2, "Utánamész"], [3, "Szólsz Feri bácsinak"]], "k": true, "b": null}, "2": {"t": [["Indulsz a lépcső felé, de valaki megfogja a kabátodat."], ["Vera az. Egy padban ültök, és ő az, aki soha nem fél semmitől."], ["— Láttam, mi történt — mondja. — Megyek én is."]], "v": [[4, "Hagyod, hogy jöjjön"], [5, "Visszaküldöd"]], "k": false, "b": null}, "3": {"t": [["Feri bácsi felmos, és közben dúdol valamit."], ["Lassú kis dallam. Olyan, mintha altatót énekelne."], ["— Oda nem mehetsz le — mondja, amikor meglátja, merre nézel. — Oda senki nem megy le."], ["Az övén kulcsok lógnak. Annyi kulcs, hogy meg sem tudod számolni."]], "v": [[6, "Elmondod neki, mi történt"], [7, "Elkérsz egy kulcsot"]], "k": true, "b": null}, "4": {"t": [["Vera jön. Nem fél, mert ő soha nem fél."], ["Ez néha jó.", "Néha nem."], ["A lépcső tetején megáll."], ["— Innen te mész — mondja. — Én itt őrködöm. Ha jön valaki, szólok."]], "v": [[8, "Lapozz tovább"]], "k": false, "b": null}, "5": {"t": [["— Ne gyere — mondod."], ["Vera megáll, és sokáig nem szól semmit."], ["Aztán azt mondja:", "— Jó. Akkor majd én szólok valakinek."], ["És elmegy."]], "v": [[8, "Lapozz tovább"]], "k": false, "b": null}, "6": {"t": [["Feri bácsi nem hisz neked."], ["— Labda? A pincében? Menj csak vissza az osztályba."], ["Ahogy visszafelé mész, elhaladsz a hirdetőtábla előtt. Nagy betűkkel ez áll rajta:"], ["FOGORVOS.", "KEDDEN.", "MINDENKI JÖN."], ["Az egyik terem ajtaja nyitva van."]], "v": [[9, "Benézel"], [2, "Visszamész a lépcsőhöz"]], "k": false, "b": null}, "7": {"t": [["— Kaphatok egy kulcsot? — kérdezed."], ["Feri bácsi olyan hosszan nevet, hogy a végén már te is nevetsz."], ["Aztán lecsatol egyet. Kicsi és rozsdás."], ["— Ez a szertáré — mondja. — Semmi más."]], "v": [[6, "Lapozz tovább"]], "k": false, "b": null}, "8": {"t": [["A pincelejáró sötét, és hideg szag jön fel alulról."], ["A harmadik lépcsőfokon egy ceruzacsonk hever. Valaki elejtette, és azóta is ott van."]], "v": [[10, "Felveszed"], [11, "Nem érsz rá"]], "k": false, "b": null}, "9": {"t": [["Üres tanterem. A táblán krétával ez áll:"], ["„Se ajtaja, se ablaka,", "mégis lakik benne valaki.”"], ["Alatta, apró betűkkel, ott a megfejtés is:"], ["TOJÁS"], ["Az ajtó fölött tábla lóg. Azt írja rajta, hogy az iskola 1903-ban épült."]], "v": [[2, "Lapozz tovább"]], "k": true, "b": null}, "10": {"t": [["Zsebre vágod a ceruzát, bár fogalmad sincs, minek."]], "v": [[13, "Lapozz tovább"]], "k": false, "b": null}, "11": {"t": [["Rohansz lefelé, és a cipőd megcsúszik."], ["CSATT!"], ["Fentről lépések hallatszanak."], ["— Ki van ott? — kiabál Feri bácsi."]], "v": [[12, "Vera őrködik odafent"], [14, "Egyedül jöttél"]], "k": false, "b": null}, "12": {"t": [["Fentről Vera hangja hallatszik. Olyan hangosan kiabál, ahogy csak bír:"], ["— Feri bácsi! Jöjjön gyorsan, kiborult a vödör!"], ["A lépések elmennek."], ["A vödör nem borult ki.", "Még nem."]], "v": [[13, "Lapozz tovább"]], "k": false, "b": null}, "13": {"t": [["Lefelé.", "Lefelé.", "Lefelé."], ["Számolod a lépcsőket.", "Huszonegy.", "Negyven.", "Hatvanegy."], ["Ennyi lépcső nem fér el egy iskola alatt, és ezt te is tudod."]], "v": [[15, "Lapozz tovább"]], "k": false, "b": null}, "14": {"t": [["Feri bácsi elkap a lépcsőn, és a szünet hátralévő része felmosás lesz."], ["A labda lent marad a sötétben."], ["De amíg felmostok, Feri bácsi végig dúdol. Megjegyzed a dallamot, mert érzed, hogy jó lesz még valamire."]], "v": [], "k": false, "b": [1, "A felmosó"]}, "15": {"t": [["A pince alján ott a labdád. Felveszed."], ["Aztán észreveszed, hogy amin állsz, az lélegzik."], ["Nem kő.", "Sárkány.", "És hat feje van."], ["Az egyik szem kinyílik."]], "v": [[16, "Lapozz tovább"]], "k": true, "b": null}, "16": {"t": [["— SZIAAAA! — mondja a fej."], ["Olyan hangosan, hogy megreccsen a plafon."], ["Nagyon örül neked, mert háromszáz éve nem látott senkit."]], "v": [[17, "Megkérdezed, hogy hívják"], [18, "Pisszegsz neki"]], "k": true, "b": null}, "17": {"t": [["— Müzli! — mondja büszkén. — Így hívnak!"], ["Az utolsó reggelijéről nevezte el magát, és az a reggeli háromszáz éve volt."], ["Nagyon jó reggeli lehetett."]], "v": [[19, "Lapozz tovább"]], "k": false, "b": null}, "18": {"t": [["— Pssz! — mondod."], ["— PSSSSZ! — súgja vissza."], ["A suttogása hangosabb, mint amikor te kiabálsz."], ["A második fej megmozdul."]], "v": [[19, "Lapozz tovább"]], "k": false, "b": null}, "19": {"t": [["A hangos fej elmagyarázza a szabályt:"], ["— Aki felébred, az ébren marad. Egészen addig, amíg le nem megy a nap."], ["Öt fej alszik még. A pince túlsó végén ajtó van, és két út vezet oda."]], "v": [[20, "A rövid út, a második fej mellett"], [21, "A hosszú út, az éhes fej mellett"]], "k": false, "b": null}, "20": {"t": [["A MÁSODIK FEJ kinyitja a szemét, és gyanakodva néz rád."], ["— Mit keresel itt? — kérdezi.", "— A labdámat — mondod.", "— Nem hiszem el — mondja a fej."], ["Bármit mondasz, nem hiszi el. De amit leírva lát, azt elhiszi."]], "v": [[22, "Van nálad ceruza"], [23, "Nincs nálad ceruza"]], "k": false, "b": null}, "21": {"t": [["A HARMADIK FEJ elállja az utat, és közben korog a hasa."], ["— Éhes vagyok — mondja. — És te pont jókor jöttél."]], "v": [[24, "Tudod a varázsszót"], [25, "Nem tudod a varázsszót"]], "k": false, "b": null}, "22": {"t": [["Írsz egy cédulát:"], ["„A LABDÁMÉRT JÖTTEM.”"], ["A második fej kétszer is elolvassa, mielőtt válaszolna."], ["— Akkor rendben — mondja. — Ez le van írva."], ["És elenged."]], "v": [[26, "Lapozz tovább"]], "k": true, "b": null}, "23": {"t": [["— Hazudsz — mondja a második fej."], ["Két ujjal felemel, és visszatesz a lépcső aljára. Olyan óvatosan, mintha egy pohár víz lennél."]], "v": [[21, "Lapozz tovább"]], "k": false, "b": null}, "24": {"t": [["Ránézel, és kimondod:"], ["— Fogorvos."], ["A harmadik fej elsápad. Lefekszik, betakarózik, és alszik."]], "v": [[26, "Lapozz tovább"]], "k": false, "b": null}, "25": {"t": [["Nincs varázsszó."], ["A harmadik fej közelebb hajol. Meleg a lehelete, és hagymaszaga van."]], "v": [[27, "Odaadod a tízóraidat"], [28, "Elszaladsz alatta"]], "k": false, "b": null}, "26": {"t": [["A kazánház ajtaja nyitva, de bent koromsötét."], ["Valami horkol odabent. Aztán csuklik egyet, és a sötét egy pillanatra narancssárga lesz."], ["A NEGYEDIK FEJ alszik ott."]], "v": [[29, "Felébreszted, hogy világos legyen"], [30, "Tapogatózva mész"]], "k": false, "b": null}, "27": {"t": [["Odaadod a tízóraidat. Müzliszelet."], ["— NE! — kiált a hangos fej. — AZ A ROKONOM VOLT!"], ["A harmadik fej egy falásra megeszi."], ["A HATODIK FEJ kinyitja a szemét, és csak annyit kérdez:"], ["— Van még?"]], "v": [[26, "Továbbmész"], [31, "Leülsz reggelizni"]], "k": false, "b": null}, "28": {"t": [["Bekap.", "Megrág.", "Kiköp."], ["A lépcső alján ülsz, és tetőtől talpig nyálas vagy. A labda a fejeden."], ["— Bocsi — mondja a harmadik fej. — Nem vagy finom."], ["Soha többé nem mész le a pincébe."]], "v": [], "k": false, "b": [2, "Nyálas"]}, "29": {"t": [["Megrázod az orrát."], ["HUPP!"], ["Láng csap ki a száján, és egyszerre világos lesz."], ["A falon fellobban az órarend."]], "v": [[32, "Eloltod a labdáddal"], [33, "Hagyod égni"]], "k": false, "b": null}, "30": {"t": [["Sötétben mész, kinyújtott kézzel."], ["Felborítasz egy vödröt. A vödör gurul, és a gurulás hangos."], ["Valahol fent az ÖTÖDIK FEJ énekelni kezd."]], "v": [[34, "Odamész hozzá"], [35, "Visszafordulsz a sötétben"]], "k": false, "b": null}, "31": {"t": [["Leülsz."], ["A harmadik fej süt valamit. Nem kérdezed meg, mi az, mert finom."], ["Hat fej beszél egyszerre, te meg csak hallgatod."], ["Mire felérsz, már vége a tanításnak."], ["Senki nem vette észre, hogy hiányoztál, és ez kicsit rosszul esik."], ["De megérte."]], "v": [], "k": false, "b": [3, "Reggeli hattal"]}, "32": {"t": [["Eloltod. Füst van, de megvagy."], ["A negyedik fej visszaalszik, és még álmában is csuklik."]], "v": [[36, "Lapozz tovább"]], "k": false, "b": null}, "33": {"t": [["Leég az órarend, aztán a függöny is, aztán jön a füst a folyosóra."], ["Mindenki kimegy az udvarra.", "Tűzoltók. Szirénák. Izgalom."], ["Egy hétig nincs tanítás."], ["Senki nem tudja meg, miért.", "Csak te tudod."]], "v": [], "k": false, "b": [4, "Elmarad a tanítás"]}, "34": {"t": [["Az ÖTÖDIK FEJ énekel, és nem tudja abbahagyni. Egyre hangosabb."], ["Ha így folytatja, mind a hat fej felébred."]], "v": [[37, "Tudod az altatódalt"], [38, "Nem tudod az altatódalt"]], "k": false, "b": null}, "35": {"t": [["Visszafordulsz."], ["De a sötétben nincs se lépcső, se ajtó. Csak sötét."], ["Leülsz a földre, és nagyon sokáig ülsz."], ["Aztán fény. Egy zseblámpa.", "Mögötte Vera,", "mögötte Feri bácsi,", "mögötte az egész tűzoltóság."], ["Otthon nem örülnek. De Vera hozott szendvicset."]], "v": [], "k": false, "b": [5, "A mentőcsapat"]}, "36": {"t": [["A kazánház mögött egy régi fénykép lóg a falon."], ["Egy sárkány van rajta. Megszámolod a fejeket."], ["Hét."], ["A hetedik nyakán valami zöld. A kép alatt évszám: 1903."], ["És a fal mellett két lépcső van. Az egyik felfelé megy, a másik lefelé."]], "v": [[40, "A felfelé vezető lépcső"], [43, "A lefelé vezető lépcső"]], "k": true, "b": null}, "37": {"t": [["Halkan énekelni kezdesz. Azt a dallamot, amit Feri bácsi dúdolt."], ["Az ötödik fej elhallgat.", "Hallgat.", "Ásít.", "Alszik."]], "v": [[36, "Lapozz tovább"]], "k": false, "b": null}, "38": {"t": [["Nem tudod a dalt."], ["Az ötödik fej még hangosabb lesz. Pereg a vakolat, és zörögnek a csövek."]], "v": [[39, "Befogod a száját"], [41, "Elfutsz"]], "k": false, "b": null}, "39": {"t": [["Két kézzel fogod be a száját."], ["Az ötödik fej elkerekedett szemmel néz, aztán bandzsítani kezd, aztán kuncogni kezd."], ["A kuncogástól elálmosodik, és elalszik."], ["A kezed nyálas.", "Megérte."]], "v": [[36, "Lapozz tovább"]], "k": false, "b": null}, "40": {"t": [["A lépcső felfelé. Előtte a HATODIK FEJ."], ["— Egy kérdés — mondja. — Aztán mehetsz."], ["„Se ajtaja, se ablaka,", "mégis lakik benne valaki.”"]], "v": [[42, "Tudod a választ"], [45, "Tippelsz"]], "k": false, "b": null}, "41": {"t": [["Mind a hat fej felébred. Egyszerre."], ["A sárkány kinyújtózik, feltöri a mennyezetet, kimászik az udvarra, és elindul."], ["Nem néz vissza."], ["Reggelre akkora lyuk marad az udvaron, mint egy uszoda."]], "v": [], "k": false, "b": [6, "A sárkány elmegy"]}, "42": {"t": [["— Tojás — mondod."], ["A hatodik fej nagyon dühös lesz."], ["— KI MONDTA MEG NEKED?"], ["De elenged. Aztán utánad szól:"], ["— A másik lépcsőn ne menj le. Ott nincs semmi."]], "v": [[43, "Mégis lemész"], [57, "Felmész"]], "k": false, "b": null}, "43": {"t": [["A lefelé vezető lépcső nem olyan, mint a másik. Nincs rajta beton, csak kő."], ["És a kövek régebbiek, mint maga az iskola."]], "v": [[44, "Lapozz tovább"]], "k": false, "b": null}, "44": {"t": [["Számolod.", "Húsz lépcső.", "Negyven."], ["Egy helyen abbamarad a fal, és onnantól már nem fal van, hanem szikla."], ["Itt véget ér az iskola, és kezdődik valami más."], ["A hangos fej utánad jön, és most először van csendben."]], "v": [[46, "Lapozz tovább"]], "k": false, "b": null}, "45": {"t": [["Tippelsz.", "— Egy… kalap?"], ["A hatodik fej úgy nevet, hogy remeg tőle az egész pince."], ["A többi fej felriad."]], "v": [[47, "Tudod a hangos fej nevét"], [48, "Nem tudod a nevét"]], "k": false, "b": null}, "46": {"t": [["Egy nagy, kerek szoba. A földön szalma meg régi pokrócok."], ["És hét mélyedés a padlóban. Hét, egymás mellett. Azért lettek ilyen mélyek, mert valaki mindig ott aludt."], ["Hat mélyedés fényes."], ["A hetedik poros."]], "v": [[49, "A poros mélyedést nézed meg"], [50, "A szoba falát nézed meg"]], "k": true, "b": null}, "47": {"t": [["Nagy levegő."], ["— MÜZLI! — kiáltod."], ["Hat fej egyszerre hallgat el, mert háromszáz éve nem mondta ki senki a nevét."], ["Müzli sírni kezd. Boldogan."], ["Aztán a füledbe súgja:"], ["— Van egy lépcső lefelé. Oda nem szabad menni.", "De te lemehetsz."]], "v": [[43, "Lemész"], [51, "Maradsz vele"]], "k": true, "b": null}, "48": {"t": [["A hangos fej a kéménybe emel."], ["— MÁSSZÁÁÁL! — bömböli."], ["Koromosan bukkansz ki a tetőn."], ["Jön a tűzoltó, jön a létra, és jön az egész iskola bámulni."], ["Egy hétig te vagy a legmenőbb."]], "v": [], "k": false, "b": [7, "A tetőn"]}, "49": {"t": [["A poros mélyedésben egy kosár áll. A kosárban gyapjú. Zöld."], ["És egy kötés, ami csak félig kész."], ["Valaki sálat kötött itt, de nem fejezte be."]], "v": [[52, "Lapozz tovább"]], "k": false, "b": null}, "50": {"t": [["A falnak támasztva egy kis tábla áll. Akkora, mint egy ajtó. Krétával teleírva."], ["Nem szavak vannak rajta, csak betűk."], ["A. A. A.", "B. B. B."], ["Százszor egymás után, és minden sorban szebben."], ["Valaki itt tanult írni.", "Egyedül.", "A sötétben."]], "v": [[52, "Lapozz tovább"]], "k": true, "b": null}, "51": {"t": [["Maradsz."], ["A hat fej tanácskozik. Sokáig, mert mind egyszerre beszélnek."], ["Aztán Müzli a nyakadba tesz egy sálat. Régi, poros és zöld."], ["— Mostantól te vagy a hetedik — mondja. — Csütörtökön gyere megint."]], "v": [], "k": false, "b": [8, "Tiszteletbeli hetedik fej"]}, "52": {"t": [["A hangos fej nagyon csendes, és ez eddig egyszer sem fordult elő."]], "v": [[54, "Megkérdezed, mi ez a hely"], [53, "Lefekszel a poros mélyedésbe"]], "k": false, "b": null}, "53": {"t": [["Belefekszel a hetedik mélyedésbe. Pont akkora, mint te."], ["Meleg van, és szalmaszaga van."], ["Csak egy percre hunyod le a szemed."], ["Négykor találnak meg, amikor már az egész iskola téged keres."], ["Soha életedben nem aludtál még ilyen jól."]], "v": [], "k": false, "b": [9, "Az üres hely"]}, "54": {"t": [["A hangos fej elmondja."], ["Heten voltak. Mindig heten."], ["De a hetedik mindig azt kérdezte, hogy mi van a papírokra írva."], ["A többiek azt mondták:"], ["— A betűk az embereké. Aludj."], ["A hetedik nem aludt el.", "Egy éjjel elment."]], "v": [[55, "Lapozz tovább"]], "k": false, "b": null}, "55": {"t": [["A pokróc alatt valami kemény."], ["Egy könyv. Vékony és kopott. A gerince elszakadt."], ["A borítóján ez áll:"], ["ÁBÉCÉS KÖNYV.", "1903."], ["Valaki ebből tanult meg olvasni."]], "v": [[56, "Elviszed"], [58, "Visszateszed"]], "k": false, "b": null}, "56": {"t": [["Beteszed a kabátod alá. Nehéz, és füstszaga van."]], "v": [[59, "Lapozz tovább"]], "k": false, "b": null}, "57": {"t": [["Felérsz egy ajtón, ami a tornaterem mögött nyílik."], ["Szól a csengő."], ["Az igazgató úr az irodája ajtajában áll. A nyakán a sál, és egyenesen rád néz."]], "v": [[61, "Odamész hozzá"], [62, "Besurransz a terembe"]], "k": false, "b": null}, "58": {"t": [["Visszateszed a pokróc alá, mert nem a tiéd."], ["Ez így helyes."], ["Később nagyon fogod bánni."]], "v": [[59, "Lapozz tovább"]], "k": false, "b": null}, "59": {"t": [["A szoba végében ajtó van. Kicsi ajtó. Embernek való, nem sárkánynak."], ["Mögötte lépcső megy felfelé."], ["A hangos fej megáll."], ["— Idáig — mondja. — Én nem férek."]], "v": [[60, "Felmész"], [63, "Visszamész a fejekhez"]], "k": false, "b": null}, "60": {"t": [["Kilencven lépcső. Meredek, szűk és poros."], ["A tetején ajtó, az ajtón kulcslyuk."], ["A kulcslyukból fény szűrődik ki, és óraketyegés hallatszik."]], "v": [[64, "Van nálad kulcs"], [65, "Nincs nálad kulcs"]], "k": false, "b": null}, "61": {"t": [["Bent vagy az irodában.", "Halk. Meleg. Ketyeg az óra."], ["Az igazgató úr leül. A sál most is a nyakán van, mert soha nem veszi le."]], "v": [[66, "Elmondod, hogy sárkány van a pincében"], [67, "Csak a labdádat kéred vissza"]], "k": false, "b": null}, "62": {"t": [["Beülsz a padba, mintha semmi sem történt volna."], ["De egész órán kopog valaki a padló alatt."], ["Kop.", "Kop-kop."]], "v": [[68, "Visszakopogsz"], [69, "Nem szólsz senkinek"]], "k": false, "b": null}, "63": {"t": [["Visszamész a fejekhez, és felmész a másik lépcsőn."], ["A hangos fej megkönnyebbül, és rögtön hangos lesz megint."], ["Senki nem állítja meg."]], "v": [[57, "Lapozz tovább"]], "k": false, "b": null}, "64": {"t": [["A rozsdás kis kulcs beleillik. Feri bácsi kulcsa. A szertáré. Semmi más."], ["Fordul egyet.", "Kattan."]], "v": [[70, "Lapozz tovább"]], "k": false, "b": null}, "65": {"t": [["Az ajtó zárva. Kopogsz."], ["A másik oldalon valaki hirtelen nagyon mozdulatlan lesz."], ["Aztán megszólal egy hang:"], ["— Ki az?"]], "v": [[71, "Megmondod a neved"], [72, "Nem szólsz semmit"]], "k": false, "b": null}, "66": {"t": [["Elmondod. Az egészet."], ["Az igazgató úr nem nevet. Becsukja az ajtót, az ablakhoz megy, és tekerni kezdi le a sálat."], ["— Mondd csak — kérdezi halkan. — Hogy hívják a hangosat?"]], "v": [[73, "Tudod a nevét"], [74, "Nem tudod a nevét"]], "k": false, "b": null}, "67": {"t": [["Megmutatod neki a labdát."], ["— Ez legurult a pincébe — mondod. — De megtaláltam."], ["— Ügyes vagy — mondja az igazgató úr, és nem kérdez semmit."], ["Ahogy kilépsz az ajtón, a padló alól csuklik valaki."]], "v": [], "k": false, "b": [10, "A labda"]}, "68": {"t": [["Kopogsz."], ["A padló megreped, és egy sárkányfej bújik ki a katedra mellett."], ["Mindenki sikít.", "Aztán mindenki nevet."], ["Hazáig kísér, de a kapun nem fér be, ezért a kertben alszik."], ["Anya nem örül."]], "v": [], "k": false, "b": [11, "A hangos fej hazakísér"]}, "69": {"t": [["Ebédnél elmeséled."], ["Senki nem hiszi el. Kinevetnek."], ["Délután az egész osztály hall egy csuklást a padló alól."], ["Akkor sem hiszik el."]], "v": [], "k": false, "b": [12, "Senki nem hiszi el"]}, "70": {"t": [["Az ajtó mögött kabátok lógnak. Kilépsz közülük egy szobába, ahol óra ketyeg."], ["Szőnyeg. Íróasztal. Az asztalnál az igazgató úr."], ["Nem ugrik fel, és nem kérdez semmit."], ["Úgy néz rád,", "mint aki száz éve vár valakit,", "aki azon az ajtón jön be."]], "v": [[66, "Lapozz tovább"]], "k": false, "b": null}, "71": {"t": [["Megmondod a neved."], ["Csend.", "Hosszú csend."], ["Aztán a zár a másik oldalról fordul el."]], "v": [[70, "Lapozz tovább"]], "k": false, "b": null}, "72": {"t": [["Nem szólsz. Visszamész a kilencven lépcsőn."], ["Soha nem tudod meg, ki volt."], ["De mostantól tudsz egy ajtóról, amiről senki más nem tud."], ["És néha, óra alatt, felnézel a mennyezetre, és elmosolyodsz."]], "v": [], "k": false, "b": [13, "A kulcslyuk"]}, "73": {"t": [["— Müzli — mondod."], ["Az igazgató úr megfogja az asztal szélét, mintha megbillent volna a szoba."], ["— Müzli — ismétli. — Hát még mindig…"], ["Aztán rád néz."], ["— Hoztál valamit?"]], "v": [[75, "Nálad van a régi ábécéskönyv"], [76, "Nincs nálad a könyv"]], "k": false, "b": null}, "74": {"t": [["Az igazgató úr megáll. Vár."], ["Aztán visszatekeri a sálat."], ["— Akkor biztos álmodtad — mondja, és kinyitja neked az ajtót."], ["De ahogy kimész, látod, hogy az ablaknál áll, és sokáig nem mozdul."]], "v": [], "k": false, "b": [14, "Akkor biztos álmodtad"]}, "75": {"t": [["Előveszed a könyvet."], ["Az igazgató úr keze remeg, ahogy kinyitja."], ["Az első oldalon, ceruzával, gyerekírással egy név áll.", "Az ő neve."], ["— Ebből tanultam — mondja. — Egyedül. Odalent."], ["A sál lecsúszik a földre."], ["A nyaka hosszú.", "Nagyon hosszú.", "És zöld."], ["Fél kilenckor hét sárkányfej áll a folyosón. Hat beszél egyszerre, a hetedik pedig olvas."], ["Müzli téged mutogat mindenkinek:"], ["— Ő az! Ő tudta a nevemet!"]], "v": [], "k": true, "b": [16, "A hetedik fej"]}, "76": {"t": [["— Nem — mondod. — Nem hoztam semmit."], ["Az igazgató úr bólint."], ["Aztán leveszi a sálat. Az egészet. És a földre ejti."], ["A nyaka hosszú.", "És zöld."], ["— Akkor menjünk le — mondja. — Együtt."], ["Lementek, és ez is nagyon jó."], ["De egy könyv még mindig ott van egy pokróc alatt, és senki nem viszi fel."]], "v": [], "k": false, "b": [15, "A sál a földön"]}}, "cimek": {"1": "A felmosó", "2": "Nyálas", "3": "Reggeli hattal", "4": "Elmarad a tanítás", "5": "A mentőcsapat", "6": "A sárkány elmegy", "7": "A tetőn", "8": "Tiszteletbeli hetedik fej", "9": "Az üres hely", "10": "A labda", "11": "A hangos fej hazakísér", "12": "Senki nem hiszi el", "13": "A kulcslyuk", "14": "Akkor biztos álmodtad", "16": "A hetedik fej", "15": "A sál a földön"}}</script>

      if (!adat.oldalak[n]) return;

        modositas[n].v.forEach(function (cimke, i) {

    var le = el("button", "mini", "Letöltés");
    le.onclick = letolt; s.appendChild(le);
    var tor = el("button", "mini", "Módosítások törlése");
    tor.onclick = function () {
      if (!confirm("Biztosan törlöd az összes módosítást?")) return;
      modositas = {}; ir(K_SZERK, modositas); alkalmaz(); ujra();
    };
    s.appendChild(tor);
    var db = Object.keys(modositas).length;
    s.appendChild(el("span", "allapot", db ? db + " oldal módosítva" : "nincs módosítás"));
    k.appendChild(s);
  }
  function ujra() { if (hol) rajzol(); else cimlap(); }

  /* ---------- oldal ---------- */
  function rajzol() {
    var k = keret(); var o = adat.oldalak[hol];
    k.innerHTML = ""; sav(k); window.scrollTo(0, 0);

    var f = el("div", "fejlec");
    if (utvonal.length > 1) {
      var b = el("button", "mini", "Vissza");
      b.onclick = function () { utvonal.pop(); hol = utvonal[utvonal.length - 1]; rajzol(); };
      f.appendChild(b);
    }
    if (szerkesztMod) f.appendChild(el("span", null, hol + ". oldal"));
    var h = el("button", "mini jobbra", "Elölről"); h.onclick = cimlap;
    f.appendChild(h); k.appendChild(f);

    if (o.b) {
      eltesz(o.b[0]);
      var v = el("p", "vegzet", "Befejezés: " + o.b[1]);
      v.appendChild(el("small", null, o.b[0] + " a 16-ból" + (o.b[0] === 16 ? " — a legjobb" : "")));
      k.appendChild(v);
    }
    if (o.k) {
      var img = new Image(); img.src = KEPEK[hol]; img.className = "kep";
      img.alt = "Rajz a történethez"; k.appendChild(img);
    }

    if (szerkesztMod) szerkesztoOldal(k, o);
    else olvasoOldal(k, o);
  }

  function olvasoOldal(k, o) {
    var sz = el("div", "szoveg");
    o.t.forEach(function (p) {
      var e = el("p");
      p.forEach(function (sor, i) {
        if (i) e.appendChild(document.createElement("br"));
        e.appendChild(document.createTextNode(sor));
      });
      sz.appendChild(e);
    });
    k.appendChild(sz);

    var val = el("div", "valasztas");
    if (o.b) {
      var a = el("button", "gomb fo", "Kezdd elölről!");
      a.onclick = function () { utvonal = []; ugras(1); }; val.appendChild(a);
      var g = el("button", "gomb", "Megtalált befejezések");
      g.onclick = gyujtemeny; val.appendChild(g);
    } else {
      o.v.forEach(function (par) {
        var b = el("button", "gomb" + (o.v.length === 1 ? " fo" : ""), par[1]);
        b.onclick = function () { ugras(par[0]); };
        val.appendChild(b);
      });
    }
    k.appendChild(val);
  }

  function szerkesztoOldal(k, o) {
    var s = el("div", "sugo");
    s.textContent = "Egy üres sor új bekezdést kezd. Az egyszerű sortörés a helyén marad. " +
      "A módosítás csak ebben a böngészőben látszik — a Letöltés gombbal kapsz egy új index.html fájlt, " +
      "amit feltöltve mindenkinek megmarad.";
    k.appendChild(s);

    k.appendChild(el("p", "cimke", "A LAP SZÖVEGE"));
    var ta = el("textarea", "szerk");
    ta.value = o.t.map(function (p) { return p.join("\n"); }).join("\n\n");
    ta.rows = Math.max(6, ta.value.split("\n").length + 2);
    ta.oninput = function () {
      var uj = ta.value.split(/\n\s*\n/).map(function (p) {
        return p.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      }).filter(function (p) { return p.length; });
      o.t = uj;
      modositas[hol] = modositas[hol] || {};
      modositas[hol].t = uj;
      ir(K_SZERK, modositas);
      var a = document.querySelector(".sav .allapot");
      if (a) a.textContent = Object.keys(modositas).length + " oldal módosítva";
    };
    k.appendChild(ta);

    if (o.v.length) {
      k.appendChild(el("p", "cimke", "VÁLASZTÁSOK"));
      o.v.forEach(function (par, i) {
        var sor = el("div", "sor");
        var inp = document.createElement("input");
        inp.type = "text"; inp.value = par[1];
        inp.oninput = function () {
          par[1] = inp.value;
          modositas[hol] = modositas[hol] || {};
          modositas[hol].v = o.v.map(function (p) { return p[1]; });
          ir(K_SZERK, modositas);
        };
        sor.appendChild(inp);
        var u = el("button", "ugras", par[0] + " →");
        u.onclick = function () { ugras(par[0]); };
        sor.appendChild(u);
        k.appendChild(sor);
      });
    }
    if (o.b) {
      var a = el("button", "gomb fo", "Kezdd elölről!");
      a.style.marginTop = "1rem";
      a.onclick = function () { utvonal = []; ugras(1); };
      k.appendChild(a);
    }
  }

  /* ---------- letöltés: a módosítások beépítve ---------- */
  function letolt() {
    var klon = document.documentElement.cloneNode(true);
    var kr = klon.querySelector("#keret"); if (kr) kr.innerHTML = "";
    var js = klon.querySelector("#konyv-adat");
    js.textContent = JSON.stringify(adat);
    var blob = new Blob(["<!DOCTYPE html>\n" + klon.outerHTML], {type: "text/html;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    var all = document.querySelector(".sav .allapot");
    if (all) all.textContent = "Letöltve — töltsd fel a GitHubra";
  }

  window.addEventListener("hashchange", function () {
    szerkeszthet = location.hash === JELSZO;
    if (!szerkeszthet) szerkesztMod = false;
    ujra();
  });

  cimlap();
})();
</script>
