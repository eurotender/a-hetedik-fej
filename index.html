<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Müzli-könyvek</title>
<meta name="description" content="Lapozgatós kalandkönyvek gyerekeknek.">
<meta name="theme-color" content="#F2F4EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--papir:#F2F4EC;--tinta:#23271F;--zold:#1F6B4A;--narancs:#E4571B;
      --halk:#7d8177;--lap:#FFFFFF;--vonal:#DCE2D4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--papir);color:var(--tinta);
  font-family:'Atkinson Hyperlegible',Verdana,Tahoma,sans-serif;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.keret{max-width:34rem;margin:0 auto;padding:28px 18px 56px}

header{margin-bottom:30px}
.jel{font-size:clamp(15px,3.8vw,17px);font-weight:700;color:var(--zold);
  letter-spacing:.08em;margin:0 0 6px}
h1{font-size:clamp(34px,10vw,50px);line-height:1.02;margin:0 0 10px;font-weight:700}
.alcim{color:var(--halk);margin:0;font-size:clamp(16px,4vw,18px)}

.konyv{background:var(--lap);border:2px solid var(--vonal);border-radius:16px;
  padding:18px;margin:0 0 16px;display:block;text-decoration:none;color:inherit}
a.konyv:active{transform:scale(.995)}
.konyv.keszul{border-style:dashed;background:transparent;opacity:.72}
.sor{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.szam{font-weight:700;color:var(--zold);font-size:clamp(15px,3.8vw,17px);flex:none}
.konyvcim{font-weight:700;font-size:clamp(21px,5.4vw,26px);line-height:1.15}
.leiras{color:var(--halk);margin:6px 0 0;font-size:clamp(15px,3.9vw,17px)}

.savok{margin-top:14px;display:grid;gap:8px}
.sav{display:flex;align-items:center;gap:10px;font-size:clamp(14px,3.6vw,16px)}
.sav .cimke{flex:none;min-width:5.6rem;color:var(--halk)}
.savkeret{flex:1;height:10px;background:var(--papir);border-radius:99px;overflow:hidden;
  border:1px solid var(--vonal)}
.savbelso{height:100%;background:var(--zold);border-radius:99px;width:0;
  transition:width .5s ease}
.savbelso.teljes{background:var(--narancs)}
.ertek{flex:none;font-weight:700;min-width:3.4rem;text-align:right}

.gomb{display:inline-block;margin-top:14px;font:inherit;font-weight:700;
  background:var(--zold);color:#fff;border:0;border-radius:10px;
  padding:12px 18px;font-size:clamp(16px,4.2vw,18px)}
.hamarosan{display:inline-block;margin-top:12px;font-weight:700;color:var(--halk);
  font-size:clamp(16px,4.2vw,18px)}

footer{margin-top:34px;text-align:center;color:var(--halk);font-size:14px}
footer button{font:inherit;font-size:14px;background:none;border:0;color:var(--halk);
  text-decoration:underline;cursor:pointer;padding:6px}
.hiba{background:#FFF3E8;border:2px solid var(--narancs);border-radius:12px;
  padding:14px 16px;color:var(--tinta);font-size:15px}
</style>
</head>
<body>
<div class="keret">
  <header>
    <p class="jel">MÜZLI-KÖNYVEK</p>
    <h1>Lapozgatós kalandkönyvek</h1>
    <p class="alcim">Te döntöd el, mi történik. Minden könyvben több befejezés van, és rengeteg elrejtett nyom.</p>
  </header>
  <main id="lista"></main>
  <footer>
    <p id="labjegyzet">A haladásod ezen a készüléken marad meg.</p>
    <button id="torol" type="button">Haladás törlése</button>
  </footer>
</div>

<script>
/* A könyvek listája a konyvek.json fájlban van. Új könyv hozzáadása:
   tedd a HTML-t a konyvek/ mappába, és vegyél fel egy sort a JSON-ba. */
const TARTALEK = {konyvek:[]};

function olvasHaladas(id){
  const ki = {veg:[], nyom:[]};
  try{
    const v = localStorage.getItem("mk:v1:"+id+":veg");
    if(v) ki.veg = JSON.parse(v) || [];
    const n = localStorage.getItem("mk:v1:"+id+":nyom");
    if(n) ki.nyom = JSON.parse(n) || [];
  }catch(e){}
  return ki;
}

function sav(cimke, megvan, ossz){
  const arany = ossz ? Math.round(100*megvan/ossz) : 0;
  const s = document.createElement("div"); s.className = "sav";
  const c = document.createElement("span"); c.className = "cimke"; c.textContent = cimke;
  const k = document.createElement("span"); k.className = "savkeret";
  const b = document.createElement("span");
  b.className = "savbelso" + (ossz && megvan >= ossz ? " teljes" : "");
  k.appendChild(b);
  const e = document.createElement("span"); e.className = "ertek";
  e.textContent = megvan + "/" + ossz;
  s.append(c, k, e);
  requestAnimationFrame(()=>{ b.style.width = arany + "%"; });
  return s;
}

function kartya(k){
  const kesz = k.allapot !== "keszul" && k.fajl;
  const doboz = document.createElement(kesz ? "a" : "div");
  doboz.className = "konyv" + (kesz ? "" : " keszul");
  if(kesz) doboz.href = k.fajl;

  const sor = document.createElement("div"); sor.className = "sor";
  const sz = document.createElement("span"); sz.className = "szam";
  sz.textContent = (k.sorszam || "?") + ".";
  const cim = document.createElement("span"); cim.className = "konyvcim";
  cim.textContent = k.cim || "Névtelen";
  sor.append(sz, cim);
  doboz.appendChild(sor);

  if(k.leiras){
    const l = document.createElement("p"); l.className = "leiras";
    l.textContent = k.leiras; doboz.appendChild(l);
  }

  if(kesz){
    const h = olvasHaladas(k.id);
    const savok = document.createElement("div"); savok.className = "savok";
    if(k.vegek)  savok.appendChild(sav("Befejezés", h.veg.length,  k.vegek));
    if(k.nyomok) savok.appendChild(sav("Nyom",      h.nyom.length, k.nyomok));
    doboz.appendChild(savok);
    const g = document.createElement("span"); g.className = "gomb";
    g.textContent = h.veg.length || h.nyom.length ? "Folytatom" : "Kezdjük!";
    doboz.appendChild(g);
  }else{
    const g = document.createElement("span"); g.className = "hamarosan";
    g.textContent = "Hamarosan…";
    doboz.appendChild(g);
  }
  return doboz;
}

function rajzol(adat){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  const konyvek = (adat.konyvek || []).slice()
      .sort((a,b)=>(a.sorszam||99)-(b.sorszam||99));
  konyvek.forEach(k => lista.appendChild(kartya(k)));
}

fetch("konyvek.json", {cache:"no-cache"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(rajzol)
  .catch(() => {
    if(TARTALEK.konyvek.length) return rajzol(TARTALEK);
    document.getElementById("lista").innerHTML =
      '<div class="hiba">A könyvlista nem töltődött be. ' +
      'Ez akkor fordul elő, ha a fájlt közvetlenül nyitod meg a gépedről. ' +
      'GitHub Pages-en jól fog működni.</div>';
  });

document.getElementById("torol").onclick = function(){
  if(!confirm("Biztosan törlöd az összes könyv haladását ezen a készüléken?")) return;
  try{
    Object.keys(localStorage).filter(k=>k.indexOf("mk:v1:")===0)
      .forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  location.reload();
};
</script>
</body>
</html>
